# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "sign-off"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
# Every check the CI gate enforces, as a re-runnable journey. Each command
# proves itself by writing its log under $DONE_DONE_EVIDENCE_ROOT and exiting 0.
journeys:
  detail-sequence:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/sequence-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  sheet-swap:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/sheet-swap-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  report-pager:
    command: 'npm run build > /dev/null && SEQUENCE_ONLY=reports node .agents/skills/done-done-verify-sign-off/sequence-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  decide-load:
    command: 'node .agents/skills/done-done-verify-sign-off/decide-load-shots.mjs "$DECIDE_PERF_BASE" "$DONE_DONE_EVIDENCE_ROOT" after'
  # Production-sized synthetic board, five mobile Lighthouse navigations; tooling stays outside the checkout.
  pwa-profile:
    command: 'node scripts/profile-board.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Lighthouse accessibility floor (A 95, target 98) on the five routes, phone and desk, light and dark; needs LIGHTHOUSE_CLI like pwa-profile.
  a11y-floor:
    command: 'node scripts/a11y-floor.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Supporting checks, not proof: a test, typecheck or build run shows the code checks pass, never that the product works, so the
  # proof is the core and upgrade journeys below. CI and release call install, test and skill by name, so those stay.
  serve-stop:
    command: 'npm run build > /dev/null && node --test test/serve-stop.test.mjs > "$DONE_DONE_EVIDENCE_ROOT/serve-stop.log" 2>&1'
  document-scroll:
    command: 'npm run build > /dev/null && node --test --test-name-pattern="report and plan documents use one page scroll" test/design.test.mjs > "$DONE_DONE_EVIDENCE_ROOT/document-scroll.log" 2>&1 && node .agents/skills/done-done-verify-sign-off/document-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  plan-review:
    command: 'node .agents/skills/done-done-verify-sign-off/plan-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${PLAN_REVIEW_THEME:-light}" "${PLAN_REVIEW_WIDTH:-390}"'
  # A clean install: npm pack, npm install in an empty folder, author with report init, then the guided plan and report in a real browser
  # with real read receipts and a real Go deeper answered through the installed CLI (a model's when MINIMAX_API_KEY is set, else a labelled stand-in).
  guide:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/guide-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${GUIDE_THEME:-light}" "${GUIDE_WIDTH:-390}"'
  # The research bar: a sample research report and plan from the packaged skill on a throwaway board, one labelled shot per part the bar names, per theme and width.
  research-bar:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/research-bar-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Selected text on a guided plan and report: the tray, offsets, cancellation, refusals and the quote in the pending request, per theme and width.
  selection:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/selection-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${GUIDE_THEME:-light}" "${GUIDE_WIDTH:-390}"'
  # Archify diagrams on a plan, per theme and width: needs DIAGRAM_DIR, a folder of pages the archify skill drew (slices.html, today.html, after.html). DIAGRAM_BEFORE=1 SIGN_OFF_REPO=<base checkout> records the no-diagram before.
  diagram:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/diagram-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${DIAGRAM_THEME:-light}" "${DIAGRAM_WIDTH:-390}"'
  # A design-output gallery in a guided report (report init --gallery): options as a strip (phone) or a row (desk), phone and desktop frames side by side with caption, model and run time,
  # tap to open full size, Previous/Next/swipe between options, at 360, 390, 445, 1280 and 1440, light and dark. GALLERY_DIR is a folder of a-phone.png, a-desktop.png, b-phone.png, b-desktop.png (real board frames).
  gallery:
    command: 'npm run build > /dev/null && for w in 360 390 445 1280 1440; do for t in light dark; do node .agents/skills/done-done-verify-sign-off/gallery-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # The report kit in a guided report (a section's blocks: film, callout, stepper, table, before and after, evidence rows, with the gallery): one gutter, no card in a card, the stepper's labels and buttons,
  # the film's poster and player, a table that stacks on a phone, at 360, 390, 445, 1280 and 1440, light and dark.
  kit:
    command: 'npm run build > /dev/null && for w in 360 390 445 1280 1440; do for t in light dark; do node .agents/skills/done-done-verify-sign-off/kit-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # Lossless reference images, pinned document downloads and original ragged/spanned tables, at 390 and 1280 in both themes.
  kit-documents:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do KIT_DOCUMENTS=1 node .agents/skills/done-done-verify-sign-off/kit-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  kit-document-flow:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do KIT_FLOW=1 node .agents/skills/done-done-verify-sign-off/kit-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # Shared media viewer for every image and video on proofs, reports and asks: full-screen sheet (never /api/), swipe with N of M, pinch/double-tap zoom, sticky score tables; 360/390/445/1280/1440 light and dark plus a 390 swipe+zoom recording.
  media-viewer:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/media-viewer-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # A page report held to the board's look (report init --page): no colour of its own, no card in a card; post refuses a palette or a nested card with the kit as the fix, the plain page opens in the board at 390 and 1280, light and dark.
  page-look:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do node .agents/skills/done-done-verify-sign-off/page-look-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # An ask on a guided report answers the tap at 390, light and dark: the Ask control pressed, Sent to the agent with the time, Already sent on a repeat with one ask saved,
  # Agent replied; and a design report's inline-SVG flow diagram at the column's width, following the board's own light-or-dark pick (diagram-sample/flow.html).
  comment-send:
    command: 'npm run build > /dev/null && for w in 360 390 445 1280 1440; do for t in light dark; do COMMENT_PROTO="$COMMENT_PROTO" SEND_FEEDBACK_ONLY=1 node .agents/skills/done-done-verify-sign-off/part-comment-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # A report acts from one place at 360, 390, 445, 1280 and 1440, light and dark: the one bar under the scroll (Agree shown Agreed, Ask, Disagree's composer and its send), Activity with the note's track whole,
  # View, and the end of the report with nothing under the bar.
  report-bar:
    command: 'npm run build > /dev/null && for w in 360 390 445 1280 1440; do for t in light dark; do node .agents/skills/done-done-verify-sign-off/report-bar-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  ask-feedback:
    command: 'npm run build > /dev/null && for t in light dark; do node .agents/skills/done-done-verify-sign-off/ask-feedback-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done'
  # Report kinds at 390 and 1280, light and dark: each row's kind chip (a plan's parts bar), Filter by kind and a kind picked, a report's head with its kind, the line on what it is for
  # and its kind parts' strip and list, research's Sources and its sources' tags and links on the guided page, an older report 4's posted kind; KINDS_MOCK=<the approved mock's shots folder> saves each beside the mock's frame.
  # Shared pinned project tiles and report kind/ticket rows; unread-only progress, five widths and both themes.
  report-rows:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/report-rows-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  report-kinds:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/report-kinds-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $KINDS_MOCK'
  # Go deeper on an answers-only (fed) board: accepted at 390 and 1280, one ask saved, no error shown.
  fed-deeper:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/fed-deeper-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${GUIDE_THEME:-light}"'
  # Not quite with a note and Tell the agent on a report, on an answers-only (fed) board at 390, light and dark: taken with no error, Sent to the agent, the saved line, the author's wait event, Agent read it.
  not-quite:
    command: 'npm run build > /dev/null && for t in light dark; do node .agents/skills/done-done-verify-sign-off/not-quite-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done'
  # Open full screen on a design pick and an interactive page, at 390 and 1280 in light and dark: the prototype's own tab and link, the other size, Reference, Close.
  fullscreen:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do FULL_WIDTH=$w node .agents/skills/done-done-verify-sign-off/fullscreen-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # The feedback trail at 390 and 1280, light and dark: answers sent, handed over by a wait, taken by the agent's own wait and replied to with feedback --reply --link, then
  # Today's Replies, Decide's badges, the Designs row, each step's card with its track, reply and Activity, a design's change notes replied to, and Today once the reply is opened.
  trail:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do node .agents/skills/done-done-verify-sign-off/trail-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # Decide's answered rows with long titles and notes at 360, 390, 445, 1280 and 1440, light and dark: each row's badge (four marks and the step's word) is one 20px line at the end of the second line, the words before it take the ellipsis.
  trail-badge:
    command: 'npm run build > /dev/null && for w in 360 390 445 1280 1440; do for t in light dark; do TRAIL_LONG=1 node .agents/skills/done-done-verify-sign-off/trail-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # The inbox at 360, 390, 445, 1280 and 1440, light and dark: new replies first, then Decide, then Waiting on agents, with kind chips; a thread's question and reply with its follow-up buttons,
  # an action and what was done with its link, a follow-up tap moving the card from Decide to Answered, a reply landing as a notice, and on a desk an ask opened beside its thread.
  inbox:
    command: 'npm run build > /dev/null && for w in 360 390 445 1280 1440; do for t in light dark; do node .agents/skills/done-done-verify-sign-off/inbox-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # Reopen at 360, 390, 445, 1280 and 1440, light and dark: an answered ask taken back with sign-off-axi reopen waits in Decide again with its choices, Your earlier answer shows the answer and note, its Activity lists the answer then the reopen,
  # reopening an open card is refused, and the next answer names the one it replaces.
  reopen:
    command: 'npm run build > /dev/null && for w in 360 390 445 1280 1440; do for t in light dark; do node .agents/skills/done-done-verify-sign-off/reopen-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # Discard at 390 and 1280, light and dark: an ask's Discard sheet of three reasons, an Undo inside 10 seconds that never reaches the agent, Select in Decide and in Designs,
  # Discard 2 with the toast's 10-second Undo, the agent's own wait handing the reasons over, and Archived with each reason, Read and Restore.
  discard:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do node .agents/skills/done-done-verify-sign-off/discard-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t $w || exit 1; done; done'
  # A design's new round and its preview at 390 and 1280, light and dark: a screen note typed and sent, the screen drawn again, then the empty note box with the earlier note folded under it, the screen filling the preview, and a design whose page is gone showing its preview picture.
  design-round:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do ROUND_WIDTH=$w node .agents/skills/done-done-verify-sign-off/design-round-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # A design review's screen preview at 390 and 1280 in light and dark: the prototype in its device's own viewport (390 by 844, 1280 by 800) scaled to the column with nothing blank under it,
  # a narrower window scaling the same page without loading it again, and Review full screen showing it whole. DESIGN_SIDE=before SIGN_OFF_REPO=<built base checkout> records the before.
  design-preview:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do DESIGN_WIDTH=$w node .agents/skills/done-done-verify-sign-off/design-preview-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # Designs in the new look (the list, a design's review, More, Change; on a desk the cards, the open design and Where it stands), one theme and width per run (DESIGNS_WIDTH=390|1280|1440),
  # measured in the browser; DESIGNS_PROTO=<the approved prototype's index.html> saves each beside the prototype's frame, DESIGNS_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  designs:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/designs-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${DESIGNS_THEME:-light}" "${DESIGNS_WIDTH:-390}"'
  # Designs one tap away on a phone: Decide's Asks and Designs, Designs lighting Decide, the order sheet, Today's Designs to review with design thumbnails, project icons in every tile
  # and each phone list's end clear of the dock, at 360, 390, 445, 1280 and 1440 in light and dark. DESIGNS_ACCESS_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  designs-access:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/designs-access-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # The leash acting at 360, 390, 445, 1280 and 1440, light and dark: Decide's Taken without you and its Leash chip and sheet, the default taken at silent_by, the agent's pick on Act, then tell me,
  # a money ask that always waits, Ask me first set from the sheet, and Change reaching the agent. LEASH_ICONS=<folder of the projects' real icons>, LEASH_REVIEW_ROOT=<folder outside the run> keeps every state there and only Decide's frames in the run.
  # The README's pictures from the real board for Umer at 390 and 1280, light and dark: Today, Decide with the Leash chip, a report in the reader with its action bar, Evidence with Previews, a ticket of an epic, Designs and the Install app row; no letter tile, token, overflow or console error.
  readme-shots:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/readme-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  leash:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/leash-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # A design asked as one plain question (design 2), on the owner's real card (DESIGN_ASK_FRAMES=<folder of today, built and target .light/.dark.webp>): the card as first written
  # refused rule by rule (refusals.txt), then the question, its frames with the changed area outlined and captioned, a note beside Yes and Yes saved as approve, at 390 and 1280, light and dark.
  design-ask:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/design-ask-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "$DESIGN_ASK_FRAMES"'
  # A screen note typed in the design viewer on an answers-only (fed) board and Request change sent, one width per run: REQUEST_WIDTH=390|1280.
  request-change:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/request-change-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${REQUEST_THEME:-light}"'
  # The board foundation (type scale, 44px controls, tab bar): Decide and Today, one theme and width per run; FOUNDATION_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  foundation:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/foundation-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${FOUNDATION_THEME:-light}" "${FOUNDATION_WIDTH:-390}"'
  # The new look's foundation (web/tokens.css, web/ui.css): Today and Reports at 390 and 1280, light and dark, measured in the browser (edges, 4px grid, rows, dock, sidebar, Inter);
  # NEWLOOK_PROTO=<the approved prototype's index.html> saves each beside the prototype's frame, NEWLOOK_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  newlook:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/newlook-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $NEWLOOK_PROTO'
  # The new look's colours beside the approved prototype (PALETTE_PROTO=<its index.html>): Today, Search, Decide and an ask, Reports and a report, Designs and a design,
  # Tickets and a ticket at 390 and 1280, light and dark, every colour each page draws read in the browser and checked against the prototype's palette on both pages
  # (Evidence listed, not checked); PALETTE_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  palette:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/palette-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "$PALETTE_PROTO"'
  # The dock's and the sidebar's filled icons beside the approved prototype's (DOCK_PROTO=<its index.html>): Today at 390 and 1280, light and dark, each icon's fill, ink box,
  # colour and place measured on both pages, and each tab opened in turn; DOCK_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  dock-icons:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/dock-icons-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "$DOCK_PROTO"'
  # The board's design tokens (web/tokens.css) in use on Today, Decide, Evidence and a report, one theme and width per run; TOKENS_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  tokens:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/tokens-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${TOKENS_THEME:-light}" "${TOKENS_WIDTH:-390}"'
  # Today (glance, tiles, section heads, rows, report card): one theme and width per run; TODAY_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  today:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/today-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${TODAY_THEME:-light}" "${TODAY_WIDTH:-390}"'
  # Markdown in authored text, one part per run: MD_PART=heading|item|table|plan-code, per theme and width. SIGN_OFF_REPO=<built base checkout> records the before.
  # The version the board and the CLI run: the sidebar's foot at 1280 and Today's More at 390, light and dark, from this checkout (<version>-dev), then the sidebar,
  # --version and the help header from this build packed and installed as npm installs it (the version as published).
  version:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/version-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # The board as an installable app: the manifest and worker as Chrome reads them, Today's More with its Install app row at 360, 390, 445, 1280 and 1440 in light and dark (and Add to Home Screen as Safari on an iPad has it), and the board with its server stopped.
  pwa:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/pwa-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  markdown:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/markdown-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${GUIDE_THEME:-light}" "${GUIDE_WIDTH:-390}"'
  # A capture's tap stays on the board on a phone, and the 4-option comparison table reads at 16 px at 390; PHONE_PART=link|table drives one part per run.
  phone-capture:
    command: 'npm run build > /dev/null && bash .agents/skills/done-done-verify-sign-off/phone-link-shots.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # A comment sent with an answer: Add a comment under a yes/no on Decide, Answer and one More…, then the Answered card and `answers`, at 390 and 1280 in light and dark.
  answer-comment:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do COMMENT_WIDTH=$w node .agents/skills/done-done-verify-sign-off/comment-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # A card's own screen in the new look at 390x844, 1280x800 and 1440x900 (2x), light and dark, measured in the browser: one property panel and one Activity on every card, the open ask, proof
  # and report, and on a desk the shell (12 columns, the list beside the open item, an ask's answers pinned in view); DETAIL_PROTO=<the approved prototype's index.html> pairs each state with it (vs-proto/).
  detail:
    command: 'npm run build > /dev/null && for w in 390 1280 1440; do node .agents/skills/done-done-verify-sign-off/detail-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" light,dark $w || exit 1; done'
  # Reports in the new look at 390x844 and 1280x800 (2x), light and dark, measured in the browser: the list (Newest, See all, By project), a guided report's sheet and a page report's,
  # Read the report, both swipes, archive with Undo and More; at 1280 the desk beside the report shown, J and U, a guided report by its link; the phone recorded (REPORTS_RECORD=1).
  # REPORTS_PROTO=<the approved prototype's index.html> pairs each phone state with the prototype's own (vs-proto/).
  reports:
    command: 'npm run build > /dev/null && REPORTS_RECORD=1 node .agents/skills/done-done-verify-sign-off/reports-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Decide in the new look beside the approved prototype (slice 3): the list (Newest, By priority, the hero, rows with P0-P3 chips, ticket bars and project tiles, Answered)
  # and an ask as a sheet over it (nothing picked, a pick, its ticket and priority, an answered ask) at 390 light and dark, the list beside an ask at 1280,
  # each measured in the browser and paired with the prototype's frame (vs-proto/), and the phone's motion recorded (decide-flow.light.390w.mp4).
  decide:
    command: 'npm run build > /dev/null && DECIDE_RECORD=1 node .agents/skills/done-done-verify-sign-off/decide-newlook-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${SIGN_OFF_PROTO:-}"'
  # Agree, Disagree and Comment on a part and its Ask menu, per theme and width: the foot row at 44 px tap targets, Disagree's What is off? box, a sent comment taken by wait --filer and answered with deeper, and a short phone recording. PART_COMMENT_BEFORE=1 SIGN_OFF_REPO=<base checkout, built> records the same page without them.
  part-comment:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/part-comment-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${PART_COMMENT_THEME:-light}" "${PART_COMMENT_WIDTH:-390}"'
  # Light pictures: real captures (IMAGES_DIR, else the repo's fixtures) posted as updates, shown from their light and thumb copies at 390 and 1280
  # in light and dark, each picture's sharpness against its frame and the bytes loaded. IMAGES_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  images:
    command: 'npm run build > /dev/null && for t in light dark; do node .agents/skills/done-done-verify-sign-off/image-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done'
  # The Tickets tab and a ticket in the new look, one width per run (TICKETS_WIDTH=390|1280|1440), light and dark, measured in the browser; TICKETS_PROTO and TICKETS_PROTO_TREE (the prototypes' index.html) save each state beside the prototype's.
  ticket-stage:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/ticket-stage-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Every empty, loading and error state, one width and theme per run (EMPTY_WIDTH=390|1280, EMPTY_THEME=light|dark), measured in the browser, with the populated Tickets screen.
  empty-states:
    command: 'npm run build > /dev/null && EMPTY_CITE=1 node .agents/skills/done-done-verify-sign-off/empty-states-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${EMPTY_THEME:-light}" "${EMPTY_WIDTH:-390}"'
  # The Tickets screen's Activity tab, one width and theme per run (ACTIVITY_WIDTH=360|390|445|1280|1440, ACTIVITY_THEME=light|dark): All tickets with its Activity card, the day timeline with every row's tags,
  # a row opened (the sheet on a phone, the dialog on a desk; Escape returns focus to the row), a filtered view and a filter that matches nothing with Clear filters.
  activity:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/activity-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${ACTIVITY_THEME:-light}" "${ACTIVITY_WIDTH:-390}"'
  tickets:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/tickets-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${TICKETS_THEME:-light,dark}" "${TICKETS_WIDTH:-390}"'
  # Tickets' See all on a phone, one width and theme per run (SEEALL_WIDTH=360|390|445|1280|1440, SEEALL_THEME=light|dark): On hold expanded, then a touch on To do's See all with the list moving under the finger expands To do and opens no ticket; a desk has no See all.
  tickets-seeall:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/tickets-seeall-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${SEEALL_THEME:-light}" "${SEEALL_WIDTH:-390}"'
  # Tickets: a card of each kind linked and unlinked, an unknown ticket, polling, hold paths and lifecycle Activity across 390/1280 and light/dark.
  # Keep the full matrix in the authorized task evidence directory; copy eight Activity frames, two collapsed phone frames and two desktop polling frames, plus factual state text and steps, into the sealed run.
  ticket:
    command: 'npm run build > /dev/null && export TICKET_REVIEW_ROOT="${SIGNOFF_TICKET_ACTIVITY_ROOT:?set SIGNOFF_TICKET_ACTIVITY_ROOT to the authorized data/signoff-ticket-activity directory}/ticket-matrix-$DONE_DONE_RUN_ID" && for w in 390 1280; do for t in light dark; do TICKET_WIDTH=$w node .agents/skills/done-done-verify-sign-off/ticket-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # Evidence's inline previews on a throwaway board of eight proofs: the list at 390 in light and dark (each row's project icon, done-done's word and first capture), one row opened in place with its captures in a strip, Previews on, and the list on a 1280 desk.
  evidence-previews:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/evidence-previews-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Concern cards on a throwaway board of three cards (Fixed and In progress with before and after captions, one with its frame pending): the list at 390 in light and dark, the Fixed card opened at 390, and the list beside it at 1280.
  concern-cards:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/concern-cards-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # A design pick of three Inbox layouts on a throwaway board: listed under Designs, and each option open full screen as a page that runs, at 360, 390, 445, 1280 and 1440 in light and dark.
  design-pick:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/design-pick-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Decide's counts: a design pick is no ask, so Asks leaves it out and Designs counts it once; each count equals the rows under it, at 390 and 1280, light and dark. The required Designs capture rides in the same run.
  decide-counts:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/decide-counts-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # A design card whose options carry a demo recording (post --video and --score): the card plays it muted in place on a tap, opens it full screen with the option's round score, and the Designs row shows its first frame; at 390 and 1280, light and dark.
  design-demo:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/design-demo-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  board-actions:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/board-actions.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # The board's own motion, one width per run (FLASH_WIDTH=390|1280, FLASH_THEME=light|dark): the first load with its read held (the skeleton and the
  # loader on screen), a poll that brings a new ask, and answering a card, with the main region read on every frame. It fails on a blank region, on a
  # region or row rebuilt under the person (the flash: every picture re-decoded and every entry animation played again), or on a read with no loader.
  # FLASH_REPO=<a built base checkout> drives that build for the before.
  board-flash:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/flash-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${FLASH_THEME:-light}" "${FLASH_WIDTH:-390}" ${FLASH_REPO:+--repo "$FLASH_REPO"}'
  attach:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/attach-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  evidence-guard:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/evidence-guard-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # The Evidence feed: a proof filed after the board was read whole (an answer) reaches Evidence on the next poll as the newest row, and the
  # feed-stall alarm fails with both timestamps and the 30-minute limit when the board's newest proof never reached the page.
  evidence-feed:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/evidence-feed-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # The board's load budget: Evidence on a phone with 60 updates loads at most 12 captures and 1.5 MB, text goes compressed, a reload and a poll are 304s.
  load-budget:
    command: 'npm run build > /dev/null && node --test --test-name-pattern="load budget" test/design.test.mjs > "$DONE_DONE_EVIDENCE_ROOT/load-budget.log" 2>&1'
  # The cold first open on a board the size of a live one (3.4 MB, a thousand answered and nine hundred dismissed cards, guided plans), at 390 px in
  # light and dark on slow 4G: the bytes that land before the board's own first paint, that paint, and the whole open, each with its per-request table.
  first-open:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/first-open-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Evidence in the new look (list and one proof) on the approved prototype's own proof, at 390 in light and dark beside the prototype's frames (EVIDENCE_PROTO=<its index.html>), and at 1280, measured in the browser.
  evidence-newlook:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/evidence-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "$EVIDENCE_PROTO"'
  today-evidence:
    command: 'npm run build > /dev/null && bash .agents/skills/done-done-verify-sign-off/today-evidence.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # A sign-in card's expiry, opened state and reissue at 390, light and dark: the poster's own clock with the time left under the hour, the card past its
  # --expires staying on the board plainly Expired with Open off, Opened — waiting for approval that survives a reload, a real reissue comment the poster
  # reads with poll, and the poster's signin done taking the card off.
  signin-expiry:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/signin-expiry-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" light,dark 390'
  # Card priority and project icons, CLI only (screen: none): --priority on posts, project --icon with its refusals, and the state and icon served back.
  priority-icon:
    command: 'npm run build > /dev/null && bash .agents/skills/done-done-verify-sign-off/priority-icon.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # The owner dispatcher on an account pool, CLI only (screen: none): the pool's pick reaches the Claude call with its credential names dropped,
  # a forced usage limit moves the request and the pool's fallover route answers as the registered owner, and a refused pool fails closed.
  owner-pool:
    command: 'npm run build > /dev/null && node --test --test-name-pattern="owner dispatch takes the pool account" test/contract.test.mjs > "$DONE_DONE_EVIDENCE_ROOT/owner-pool.log" 2>&1'
  install:
    command: "npm ci > $DONE_DONE_EVIDENCE_ROOT/install.log 2>&1"
  # notify test against a stub muxr answering 202: delivered_to 0 fails, 2 passes, a bare 100.x link_base is refused.
  notify:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/notify-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Real test-phone captures of a notify journey, from PHONE_PROOF_DIR.
  phone-notify:
    command: 'node .agents/skills/done-done-verify-sign-off/phone-notify-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  test:
    command: "npm test > $DONE_DONE_EVIDENCE_ROOT/test.log 2>&1"
  skill:
    command: "printf 'run=%s head=%s\\n' \"$DONE_DONE_RUN_ID\" \"$(git rev-parse HEAD)\" > $DONE_DONE_EVIDENCE_ROOT/skill.log && npm run build:skill -- --check >> $DONE_DONE_EVIDENCE_ROOT/skill.log 2>&1"
  core:
    command: node .agents/skills/done-done-verify-sign-off/core-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"
    core: true
  upgrade:
    command: node .agents/skills/done-done-verify-sign-off/core-journey.mjs "$DONE_DONE_EVIDENCE_ROOT" --upgrade
    upgrade: true
approved_requirements:
  - kind: spec
    name: design-pick-listing
    requirement: A design pick is listed under Designs.
    capture: designs.1440.dark.png
