# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "sign-off"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
# Every check the CI gate enforces, as a re-runnable journey. Each command
# proves itself by writing its log under $DONE_DONE_EVIDENCE_ROOT and exiting 0.
journeys:
  # Supporting checks, not proof: a test, typecheck or build run shows the code checks pass, never that the product works, so the
  # proof is the core and upgrade journeys below. CI and release call install, test and skill by name, so those stay.
  serve-stop:
    command: 'npm run build > /dev/null && node --test test/serve-stop.test.mjs > "$DONE_DONE_EVIDENCE_ROOT/serve-stop.log" 2>&1'
  document-scroll:
    command: 'npm run build > /dev/null && node --test --test-name-pattern="report and plan documents use one page scroll" test/design.test.mjs > "$DONE_DONE_EVIDENCE_ROOT/document-scroll.log" 2>&1 && node .agents/skills/done-done-verify-sign-off/document-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  plan-review:
    command: 'node .agents/skills/done-done-verify-sign-off/plan-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${PLAN_REVIEW_THEME:-light}" "${PLAN_REVIEW_WIDTH:-390}"'
  # A clean install: npm pack, npm install in an empty folder, author with report init, then the guided plan and report in a real browser
  # with real read receipts and a real Go deeper answered through the installed CLI (a model's when MINIMAX_API_KEY is set, else a labelled stand-in).
  guide:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/guide-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${GUIDE_THEME:-light}" "${GUIDE_WIDTH:-390}"'
  # The research bar: a sample research report and plan from the packaged skill on a throwaway board, one labelled shot per part the bar names, per theme and width.
  research-bar:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/research-bar-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Selected text on a guided plan and report: the tray, offsets, cancellation, refusals and the quote in the pending request, per theme and width.
  selection:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/selection-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${GUIDE_THEME:-light}" "${GUIDE_WIDTH:-390}"'
  # Archify diagrams on a plan, per theme and width: needs DIAGRAM_DIR, a folder of pages the archify skill drew (slices.html, today.html, after.html). DIAGRAM_BEFORE=1 SIGN_OFF_REPO=<base checkout> records the no-diagram before.
  diagram:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/diagram-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${DIAGRAM_THEME:-light}" "${DIAGRAM_WIDTH:-390}"'
  # Go deeper on an answers-only (fed) board: accepted at 390 and 1280, one ask saved, no error shown.
  fed-deeper:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/fed-deeper-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${GUIDE_THEME:-light}"'
  # Open full screen on a design pick and an interactive page, at 390 and 1280 in light and dark: the prototype's own tab and link, the other size, Reference, Close.
  fullscreen:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do FULL_WIDTH=$w node .agents/skills/done-done-verify-sign-off/fullscreen-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # A design's new round and its preview at 390 and 1280, light and dark: a screen note typed and sent, the screen drawn again, then the empty note box with the earlier note folded under it, the screen filling the preview, and a design whose page is gone showing its preview picture.
  design-round:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do ROUND_WIDTH=$w node .agents/skills/done-done-verify-sign-off/design-round-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # A design review's screen preview at 390 and 1280 in light and dark: the prototype in its device's own viewport (390 by 844, 1280 by 800) scaled to the column with nothing blank under it,
  # a narrower window scaling the same page without loading it again, and Review full screen showing it whole. DESIGN_SIDE=before SIGN_OFF_REPO=<built base checkout> records the before.
  design-preview:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do DESIGN_WIDTH=$w node .agents/skills/done-done-verify-sign-off/design-preview-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # A screen note typed in the design viewer on an answers-only (fed) board and Request change sent, one width per run: REQUEST_WIDTH=390|1280.
  request-change:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/request-change-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${REQUEST_THEME:-light}"'
  # The board foundation (type scale, 44px controls, tab bar): Decide and Today, one theme and width per run; FOUNDATION_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  foundation:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/foundation-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${FOUNDATION_THEME:-light}" "${FOUNDATION_WIDTH:-390}"'
  # The new look's foundation (web/tokens.css, web/ui.css): Today and Reports at 390 and 1280, light and dark, measured in the browser (edges, 4px grid, rows, dock, sidebar, Inter);
  # NEWLOOK_PROTO=<the approved prototype's index.html> saves each beside the prototype's frame, NEWLOOK_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  newlook:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/newlook-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $NEWLOOK_PROTO'
  # The dock's and the sidebar's filled icons beside the approved prototype's (DOCK_PROTO=<its index.html>): Today at 390 and 1280, light and dark, each icon's fill, ink box,
  # colour and place measured on both pages, and each tab opened in turn; DOCK_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  dock-icons:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/dock-icons-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "$DOCK_PROTO"'
  # The board's design tokens (web/tokens.css) in use on Today, Decide, Evidence and a report, one theme and width per run; TOKENS_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  tokens:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/tokens-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${TOKENS_THEME:-light}" "${TOKENS_WIDTH:-390}"'
  # Today (glance, tiles, section heads, rows, report card): one theme and width per run; TODAY_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  today:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/today-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${TODAY_THEME:-light}" "${TODAY_WIDTH:-390}"'
  # Markdown in authored text, one part per run: MD_PART=heading|item|table|plan-code, per theme and width. SIGN_OFF_REPO=<built base checkout> records the before.
  markdown:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/markdown-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${GUIDE_THEME:-light}" "${GUIDE_WIDTH:-390}"'
  # A capture's tap stays on the board on a phone, and the 4-option comparison table reads at 16 px at 390; PHONE_PART=link|table drives one part per run.
  phone-capture:
    command: 'npm run build > /dev/null && bash .agents/skills/done-done-verify-sign-off/phone-link-shots.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # A comment sent with an answer: Add a comment under a yes/no on Decide, Answer and one More…, then the Answered card and `answers`, at 390 and 1280 in light and dark.
  answer-comment:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do COMMENT_WIDTH=$w node .agents/skills/done-done-verify-sign-off/comment-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  # Reports in the new look at 390x844 and 1280x800 (2x), light and dark, measured in the browser: the list (Newest, See all, By project), a guided report's sheet and a page report's,
  # Read the report, both swipes, archive with Undo and More; at 1280 the desk beside the report shown, J and U, a guided report by its link; the phone recorded (REPORTS_RECORD=1).
  # REPORTS_PROTO=<the approved prototype's index.html> pairs each phone state with the prototype's own (vs-proto/).
  reports:
    command: 'npm run build > /dev/null && REPORTS_RECORD=1 node .agents/skills/done-done-verify-sign-off/reports-shots.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # Decide in the new look beside the approved prototype (slice 3): the list (Newest, By priority, the hero, rows with P0-P3 chips, ticket bars and project tiles, Answered)
  # and an ask as a sheet over it (nothing picked, a pick, its ticket and priority, an answered ask) at 390 light and dark, the list beside an ask at 1280,
  # each measured in the browser and paired with the prototype's frame (vs-proto/), and the phone's motion recorded (decide-flow.light.390w.mp4).
  decide:
    command: 'npm run build > /dev/null && DECIDE_RECORD=1 node .agents/skills/done-done-verify-sign-off/decide-newlook-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${SIGN_OFF_PROTO:-}"'
  # Agree, Disagree and Comment on a part and its Ask menu, per theme and width: the foot row at 44 px tap targets, Disagree's What is off? box, a sent comment taken by wait --filer and answered with deeper, and a short phone recording. PART_COMMENT_BEFORE=1 SIGN_OFF_REPO=<base checkout, built> records the same page without them.
  part-comment:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/part-comment-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" "${PART_COMMENT_THEME:-light}" "${PART_COMMENT_WIDTH:-390}"'
  # Light pictures: real captures (IMAGES_DIR, else the repo's fixtures) posted as updates, shown from their light and thumb copies at 390 and 1280
  # in light and dark, each picture's sharpness against its frame and the bytes loaded. IMAGES_SIDE=before SIGN_OFF_REPO=<built base checkout> records the base.
  images:
    command: 'npm run build > /dev/null && for t in light dark; do node .agents/skills/done-done-verify-sign-off/image-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done'
  # Tickets: a card of each kind linked and unlinked, a card naming an unknown ticket, and the ticket's page, at 390 and 1280 in light and dark, with a tap through the row and Back.
  ticket:
    command: 'npm run build > /dev/null && for w in 390 1280; do for t in light dark; do TICKET_WIDTH=$w node .agents/skills/done-done-verify-sign-off/ticket-shots.mjs "$DONE_DONE_EVIDENCE_ROOT" $t || exit 1; done; done'
  board-actions:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/board-actions.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  attach:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/attach-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  evidence-guard:
    command: 'npm run build > /dev/null && node .agents/skills/done-done-verify-sign-off/evidence-guard-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"'
  # The board's load budget: Evidence on a phone with 60 updates loads at most 12 captures and 1.5 MB, text goes compressed, a reload and a poll are 304s.
  load-budget:
    command: 'npm run build > /dev/null && node --test --test-name-pattern="load budget" test/design.test.mjs > "$DONE_DONE_EVIDENCE_ROOT/load-budget.log" 2>&1'
  today-evidence:
    command: 'npm run build > /dev/null && bash .agents/skills/done-done-verify-sign-off/today-evidence.sh "$DONE_DONE_EVIDENCE_ROOT"'
  # Card priority and project icons, CLI only (screen: none): --priority on posts, project --icon with its refusals, and the state and icon served back.
  priority-icon:
    command: 'npm run build > /dev/null && bash .agents/skills/done-done-verify-sign-off/priority-icon.sh "$DONE_DONE_EVIDENCE_ROOT"'
  install:
    command: "npm ci > $DONE_DONE_EVIDENCE_ROOT/install.log 2>&1"
  test:
    command: "npm test > $DONE_DONE_EVIDENCE_ROOT/test.log 2>&1"
  skill:
    command: "printf 'run=%s head=%s\\n' \"$DONE_DONE_RUN_ID\" \"$(git rev-parse HEAD)\" > $DONE_DONE_EVIDENCE_ROOT/skill.log && npm run build:skill -- --check >> $DONE_DONE_EVIDENCE_ROOT/skill.log 2>&1"
  core:
    command: node .agents/skills/done-done-verify-sign-off/core-journey.mjs "$DONE_DONE_EVIDENCE_ROOT"
    core: true
  upgrade:
    command: node .agents/skills/done-done-verify-sign-off/core-journey.mjs "$DONE_DONE_EVIDENCE_ROOT" --upgrade
    upgrade: true
