<!doctype html>
<!-- Demo mock C: a dense grid of switches. Self-contained; no network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout C</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1rem; background: #f6f3ee; color: #1f1b16; font: .9375rem/1.4 system-ui, sans-serif; }
  h1 { font-size: 1.125rem; margin: 0 0 .5rem; }
  div { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  p { margin: 0; padding: .625rem .75rem; background: #fff; border: 1px solid #e6e0d6; border-radius: .625rem; display: grid; gap: .125rem; }
  b { font-size: .8125rem; }
  span { color: #6a6157; font-size: .8125rem; }
</style>
</head>
<body>
<h1>Settings</h1>
<div>
  <p><b>Digest</b><span>On</span></p>
  <p><b>Dark</b><span>Auto</span></p>
  <p><b>Retries</b><span>3</span></p>
  <p><b>Alerts</b><span>Off</span></p>
  <p><b>Backup</b><span>On</span></p>
  <p><b>Sounds</b><span>Off</span></p>
</div>
</body>
</html>
