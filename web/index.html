<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisions · sign-off</title>
<style>
  :root { color-scheme: light dark;
    --bg: #FFFFFF; --surface: #F7F7F8; --line: #E6E6EA; --text: #1A1A1E; --muted: #5E5E6B;
    --border: #8A8A96; --accent: #4E5BC9; --on-accent: #FFFFFF; --danger: #B42318; }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0F0F11; --surface: #18181B; --line: #27272C; --text: #EDEDEF; --muted: #9C9CA8;
    --border: #6E6E7B; --accent: #8E97F2; --on-accent: #0F0F11; --danger: #FF8A80; } }
  * { box-sizing: border-box; }
  body { margin: 0 0 3rem; background: var(--bg); color: var(--text); overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
    font: 1rem/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); }
  .bar, main { max-width: 55rem; margin: 0 auto; padding: 0 1rem; }
  .bar { display: flex; align-items: center; gap: 0.625rem; min-height: 3.5rem; flex-wrap: wrap; }
  .bar h1 { font-size: 1rem; font-weight: 600; margin: 0; flex: 1 0 auto; }
  .count { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  .banner { margin: 1rem 0 0; padding: 0.75rem 1rem; border: 1px solid var(--danger); border-radius: 0.5rem; color: var(--danger); }
  h2 { font-size: 0.8125rem; font-weight: 600; color: var(--muted); margin: 2rem 0 0.5rem; letter-spacing: 0.01em; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 0.75rem; }
  .row { display: grid; gap: 0.875rem; padding: 1rem; }
  .row + .row { border-top: 1px solid var(--line); }
  .row h3 { font-size: 1.0625rem; font-weight: 600; line-height: 1.4; margin: 0; }
  .about, details p { color: var(--muted); margin: 0.25rem 0 0; max-width: 70ch; }
  .about { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row:has(details:not(.note)[open]) .about { display: none; }
  summary { cursor: pointer; color: var(--accent); font-size: 0.875rem; margin-top: 0.25rem; width: fit-content; }
  .meta { color: var(--muted); font-size: 0.8125rem; margin: 0.5rem 0 0; }
  .evidence { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; background: color-mix(in srgb, var(--accent) 5%, var(--bg)); }
  .evidence-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .evidence-head h4 { margin: 0; font-size: .9rem; letter-spacing: .02em; }
  .verdict { border-radius: 999px; padding: .2rem .65rem; font-size: .75rem; font-weight: 700; background: var(--line); }
  .verdict[data-result="RUN PASS"] { color: #147a4a; background: #dff5e9; }
  .verdict[data-result="RUN FAIL"] { color: #a32020; background: #fde5e2; }
  .verdict[data-result="INCONCLUSIVE"], .verdict[data-result="UNVERIFIED"] { color: #79510d; background: #fff1cc; }
  .checks { display: grid; gap: .5rem; margin: .9rem 0; }
  .check { margin: 0; color: var(--muted); font-size: .875rem; }
  .check strong { color: var(--text); text-transform: capitalize; }
  .commit { color: var(--muted); font: .75rem/1.5 ui-monospace, monospace; overflow-wrap: anywhere; margin: .5rem 0; }
  .media { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: .75rem; }
  .media a { display: block; color: var(--accent); }
  .media img, .media video { display: block; width: 100%; max-height: 20rem; object-fit: contain; border-radius: .7rem; background: #111; }
  .unverified, .media .gone { color: var(--danger); margin: .5rem 0; }
  .update-media { grid-column: 1 / -1; }
  .err:not(:empty) { color: var(--danger); font-size: 0.875rem; margin-top: 0.5rem; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  button { min-height: 2.75rem; padding: 0 1.25rem; border-radius: 0.5rem; border: 1px solid var(--border); cursor: pointer;
    background: var(--bg); color: var(--text); font: inherit; font-weight: 500; }
  button.rec { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: 0.6; cursor: progress; }
  .choices.many { display: flex; flex-wrap: wrap; }
  .choices.many button { flex: 1 1 auto; max-width: 100%; padding: 0.5rem 1rem; }
  .note label { display: block; color: var(--muted); font-size: 0.8125rem; margin-top: 0.5rem; }
  .tradeoff { color: var(--muted); font-size: 0.875rem; margin: 0.5rem 0 0; max-width: 70ch; }
  .mocks { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 0.75rem; }
  .mock { margin: 0; border: 1px solid var(--line); border-radius: 0.7rem; overflow: hidden; background: var(--bg); min-width: 0; }
  .mock iframe { display: block; width: 100%; height: 16rem; border: 0; background: #fff; }
  .mock img { display: block; width: 100%; max-height: 16rem; object-fit: contain; background: #111; }
  .mock figcaption { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
  .round { margin-top: 0.5rem; }
  textarea { display: block; width: 100%; max-width: 70ch; margin-top: 0.25rem; padding: 0.5rem 0.75rem; border: 1px solid var(--border);
    border-radius: 0.5rem; background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  .saved-note { white-space: pre-line; }
  button:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { margin: 0; padding: 1.5rem 1rem; color: var(--muted); text-align: center; }
  @media (min-width: 45rem) {
    .bar, main { padding: 0 2rem; }
    .row { grid-template-columns: 1fr auto; align-items: start; gap: 2rem; padding: 1.125rem 1.25rem; }
    .choices { grid-template-columns: repeat(2, 5.5rem); }
    .row:has(.choices.many) { row-gap: 0.875rem; }
    .choices.many { grid-column: 1 / -1; }
    .choices.many button { flex: 0 1 auto; min-width: 5.5rem; }
  }
</style>
</head>
<body>
<header><div class="bar">
  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>Decisions</h1><span class="count" id="count" aria-live="polite"></span>
</div></header>
<main><p class="banner" id="banner" role="alert" hidden></p><div id="board"></div></main>
<script>
  let state = { decisions: [], answers: {} };
  const drafts = new Map(); // Typed notes not yet sent, kept across re-renders.
  // Text goes in as text nodes, never as HTML, so a title from the file can't run code.
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    e.append(...kids);
    return e;
  };

  async function call(path, init) {
    const res = await fetch(path, init);
    const body = await res.json().catch(() => ({ error: `The server replied ${res.status}` }));
    if (!res.ok) throw new Error(body.error);
    state = body;
    render();
  }

  function save(d, o, buttons, err) {
    buttons.forEach((b) => (b.disabled = true));
    const note = drafts.get(d.key) ?? state.answers[d.key]?.note ?? '';
    drafts.delete(d.key);
    call('/api/answers', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: d.key, answer: o.value, note }),
    }).catch((e) => {
      if (!drafts.has(d.key)) drafts.set(d.key, note);
      err.textContent = `Couldn't save: ${e.message}`;
      buttons.forEach((b) => (b.disabled = false));
    });
  }

  function evidenceCard(d) {
    const card = d.evidenceCard, link = d.evidence;
    if (!link) return '';
    const head = el('div', { class: 'evidence-head' }, el('h4', {}, 'Proof record'), el('span', { class: 'verdict', 'data-result': card?.result ?? 'UNVERIFIED' }, card?.result ?? 'UNVERIFIED'));
    const checks = el('div', { class: 'checks' }, ...['outcome', 'repro', 'proof', 'evidence'].map((name) =>
      el('p', { class: 'check' }, el('strong', {}, `${name}: `), document.createTextNode(link[name].replace(new RegExp(`^${name}:\\s*(?=\\S)`, 'i'), '')))));
    const media = el('div', { class: 'media' }, ...(card?.media ?? []).map((item) => {
      const node = item.type.startsWith('image/') ? el('img', { src: item.url, alt: `Evidence image: ${item.path}` })
        : el('video', { src: item.url, controls: '', preload: 'metadata', 'aria-label': `Evidence recording: ${item.path}` });
      return el('a', { href: item.url, target: '_blank', rel: 'noopener', 'aria-label': `Open ${item.path}` }, node);
    }));
    return el('section', { class: 'evidence', 'aria-label': 'Read-only proof evidence' }, head,
      card?.commit ? el('p', { class: 'commit' }, `Commit · ${card.commit}`) : '',
      el('p', { class: 'meta' }, 'Run result only · the lines below were not checked against this run.'),
      card?.status === 'unverified' ? el('p', { class: 'unverified' }, `Evidence unavailable · ${card.reason}`) : '', checks,
      media.childElementCount ? media : el('p', { class: 'meta' }, 'No recorded image or recording.'));
  }

  function row(d) {
    const meta = [['Recommended', d.recommend_value], ['If no answer', d.default_if_silent]].filter(([, v]) => v);
    const err = el('div', { class: 'err', role: 'alert' });
    const saved = Object.hasOwn(state.answers, d.key) ? state.answers[d.key] : undefined;
    // Yes/No rows keep the two fixed buttons they always had; any other choice set wraps.
    const many = d.options.map((o) => o.value).sort().join() !== 'no,yes';
    const update = d.type === 'evidence';
    const box = el('textarea', { id: `note-${d.key}`, rows: 2, maxlength: 500, dir: 'auto' });
    box.value = drafts.get(d.key) ?? saved?.note ?? '';
    box.oninput = () => drafts.set(d.key, box.value);
    const noteText = saved?.note ? 'Edit note' : 'Add a note';
    const buttons = d.options.map((o) => el('button', {
      class: o.value === d.recommend_value ? 'rec' : '', 'aria-label': `${o.label}, ${d.title}`,
      'aria-pressed': o.value === state.answers[d.key]?.answer,
    }, o.label));
    buttons.forEach((b, i) => (b.onclick = () => save(d, d.options[i], buttons, err)));
    const asked = (state.rounds ?? []).filter((r) => r.key === d.key);
    const roundBtn = el('button', { class: 'round', 'aria-label': `Ask for another round, ${d.title}` }, 'Ask for another round');
    roundBtn.onclick = () => {
      roundBtn.disabled = true;
      const note = (drafts.get(d.key) ?? state.answers[d.key]?.note ?? '').trim();
      call('/api/rounds', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: d.key, note }),
      }).catch((e) => {
        err.textContent = `Couldn't ask: ${e.message}`;
        roundBtn.disabled = false;
      });
    };
    return el('article', { class: 'row' }, el('div', {},
      el('h3', { dir: 'auto' }, update ? `Update ${d.number} · ${d.title}` : d.title),
      d.about ? el('p', { class: 'about', dir: 'auto' }, d.about) : '',
      d.detail || d.about?.length > 180 ? el('details', {}, el('summary', {}, 'Show more'),
        ...[d.about, d.detail].filter(Boolean).map((t) => el('p', { dir: 'auto' }, t))) : '',
      d.tradeoff ? el('p', { class: 'tradeoff', dir: 'auto' }, `Trade-off: ${d.tradeoff}`) : '',
      d.link ? el('p', { class: 'meta' }, /^https?:/.test(d.link)
        ? el('a', { href: d.link, target: '_blank', rel: 'noopener' }, d.link) : `Commit ${d.link}`) : '',
      meta.length ? el('p', { class: 'meta' }, meta.map(([k, v]) => `${k}: ${d.options.find((o) => o.value === v).label}`).join(' · ')) : '',
      saved?.note ? el('p', { class: 'meta saved-note', dir: 'auto' }, `Your note: ${saved.note}`) : '',
      asked.length ? el('p', { class: 'meta', dir: 'auto' }, `You asked for another round${asked.length > 1 ? ` (${asked.length})` : ''}: ${asked[asked.length - 1].note}`) : '',
      el('details', { class: 'note', ...(drafts.has(d.key) && { open: '' }) }, el('summary', { 'aria-label': `${noteText}, ${d.title}` }, noteText),
        el('label', { for: box.id }, update ? 'Optional note, sent with your verdict' : 'Optional note, sent with the answer you pick'), box),
      update ? '' : roundBtn,
      err,
    ), updateMedia(d), el('div', { class: many ? 'choices many' : 'choices', role: 'group', 'aria-label': d.title }, ...buttons), mockCards(d), evidenceCard(d));
  }

  // Each file is hash-checked by the server; one that changed or went missing says so instead of a broken frame.
  function updateMedia(d) {
    if (d.type !== 'evidence') return '';
    return el('div', { class: 'media update-media' }, ...d.media.map((m, i) => {
      const url = `/api/media?key=${encodeURIComponent(d.key)}&i=${i}`, name = `Update ${d.number}, capture ${i + 1} of ${d.media.length}`;
      const node = /\.(mp4|webm)$/i.test(m.path) ? el('video', { src: url, controls: '', playsinline: '', preload: 'metadata', 'aria-label': name })
        : el('a', { href: url, target: '_blank', rel: 'noopener', 'aria-label': `Open ${name}` }, el('img', { src: url, alt: name }));
      (node.tagName === 'A' ? node.firstChild : node).onerror = () => node.replaceWith(el('p', { class: 'gone' }, `${name} is missing or changed since it was posted.`));
      return node;
    }));
  }

  function mockCards(d) {
    if (d.type !== 'design' || !d.mocks?.length) return '';
    return el('div', { class: 'mocks' }, ...d.mocks.map((m) => {
      const label = d.options.find((o) => o.value === m.value)?.label ?? m.value;
      const url = `/api/mock?key=${encodeURIComponent(d.key)}&value=${encodeURIComponent(m.value)}`;
      const view = /\.html?$/i.test(m.path) ? el('iframe', { src: url, title: `Mock ${label}`, loading: 'lazy' })
        : el('img', { src: url, alt: `Mock: ${label}` });
      return el('figure', { class: 'mock' }, view, el('figcaption', {},
        el('span', {}, label),
        m.value === d.recommend_value ? el('span', { class: 'verdict', 'data-result': 'RUN PASS' }, 'Recommended') : ''));
    }));
  }

  function render() {
    const asks = state.decisions.filter((d) => d.type !== 'evidence');
    const updates = state.decisions.filter((d) => d.type === 'evidence').sort((a, b) => b.number - a.number);
    const waiting = asks.filter((d) => !Object.hasOwn(state.answers, d.key));
    const answered = asks.filter((d) => Object.hasOwn(state.answers, d.key));
    const unjudged = updates.filter((d) => !Object.hasOwn(state.answers, d.key)).length;
    document.getElementById('count').textContent = `${waiting.length + unjudged} waiting · ${answered.length + updates.length - unjudged} answered`;
    const list = (items) => el('div', { class: 'list' }, ...items.map(row));
    document.getElementById('board').replaceChildren(
      el('h2', {}, 'Waiting'), waiting.length ? list(waiting) : el('p', { class: 'list empty' }, unjudged ? 'No questions waiting.' : 'Nothing is waiting on you.'),
      ...(updates.length ? [el('h2', {}, 'Evidence updates, newest first'), list(updates)] : []),
      ...(answered.length ? [el('h2', {}, 'Answered'), list(answered)] : []));
  }

  const banner = document.getElementById('banner');
  call('/api/decisions').then(() => (banner.hidden = true), (e) => {
    banner.textContent = `Can't read the decisions file: ${e.message}`;
    banner.hidden = false;
  });
</script>
</body>
</html>
