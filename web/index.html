<style>
  /* Spacious, Apple grade. A phone reads white tiles on a grey grouped page; a desk reads grey tiles on a white page (the 64rem block swaps them).
     The board's own names below are all mapped onto tokens.css, where every raw value lives, and draw only the approved prototype's palette: --accent (a link, a focus ring)
     and --action (a main button's fill) are ink with the canvas's colour on it, done is the bar's ink fill, a warning is amber and red is for what failed or waits on you. */
  :root {
    --page: var(--tk-grouped); --tile: var(--tk-surface); --desk: var(--tk-canvas); --desk-tile: var(--tk-card); --bar: var(--tk-surface-high); --sunk: var(--tk-surface-selected); --line: var(--tk-rail);
    --text: var(--tk-text); --muted: var(--tk-text-secondary); --border: var(--tk-text-tertiary); --accent: var(--tk-ink); --action: var(--tk-ink); --on-accent: var(--tk-canvas); --danger: var(--tk-critical); --bezel: var(--tk-text);
    --c-waiting: var(--action); --c-evidence: var(--tk-fill); --c-reports: var(--tk-warn); --c-answered: var(--muted); --c-gate: var(--tk-warn);
    --ok: var(--c-evidence); --warn: var(--c-reports); --badge: var(--tk-critical); --faint: var(--tk-text-tertiary);
    --bg: var(--page); --surface: var(--tile); --seg-on: var(--tk-on); --gutter: var(--tk-gutter); }
  /* One type scale (28/20/17/16/15/13/12, 32 and 22 on a desk), one 4px spacing grid, one control size per role: 44px for a main action and every tap target, 10px corners.
     The sizes of a title, body, secondary line and footnote, the card corner and the raised shadow come from tokens.css; the display sizes are the board's own. */
  :root { --t-xl: 1.75rem; --t-l: 1.25rem; --t-m: var(--tk-fs-title); --t-b: var(--tk-fs-body); --t-s: var(--tk-fs-secondary); --t-xs: var(--tk-fs-footnote); --t-xxs: 0.75rem; --r-ctl: var(--tk-r-ctl); --r-card: var(--tk-r-card); --ctl: 2.75rem; }
  @media (min-width: 64rem) { :root { --t-xl: 2rem; --t-l: 1.375rem; } }
  /* The approved feel's surfaces: Today's ground and raised cards, the tab bar and its pill, a hairline, a second fill, and the lift of a card and of a capture. */
  :root { --ground: var(--tk-grouped); --card: var(--tk-surface); --side: var(--tk-canvas); --tabbar: var(--tk-card); --tab-on: var(--tk-on); --hairline: var(--tk-line); --fill-2: var(--tk-track);
    --shadow-card: var(--tk-elev-card); --shot-edge: 0 0 0 1px var(--tk-line), var(--tk-elev-card); }
  @media (prefers-color-scheme: dark) { :root { --ground: var(--tk-canvas); --sunk: var(--tk-input); --bezel: var(--tk-rail); } }
  * { box-sizing: border-box; }
  /* A phone keeps 140px at the bottom, so the last row scrolls fully clear of the floating tab bar. */
  /* A phone keeps the text size it was given on every screen, so the tab bar never grows or shrinks. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; padding-bottom: calc(8.75rem + env(safe-area-inset-bottom)); background: var(--bg); color: var(--text); overflow-wrap: anywhere;
    -webkit-font-smoothing: antialiased; font: var(--t-b)/1.5 var(--tk-font); letter-spacing: -0.011em; }
  /* The board areas each have a colour, used on icons, dots and marks. */
  .i-waiting { --area: var(--c-waiting); } .i-evidence { --area: var(--c-evidence); } .i-reports { --area: var(--c-reports); } .i-answered { --area: var(--c-answered); }
  main { max-width: 72rem; margin: 0 auto; padding: 0 max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left)); }
  .banner { margin: 1rem 0 0; padding: 0.75rem 1rem; border: 1px solid var(--danger); border-radius: 0.5rem; color: var(--danger); }
  /* The page's title row, as ui.css draws it: 8px from the top, a 24px medium title in a 44px row. */
  .top { position: relative; padding: 0.5rem 0 1rem; }
  /* A search field; what matches lists under it. */
  .search { margin: 0 0 1rem; }
  .search input { width: 100%; min-height: 2.75rem; padding: 0 0.875rem; border: 0; border-radius: 0.625rem; background: var(--sunk); color: var(--text); font: inherit; }
  .search .rows { margin-top: 0.75rem; }
  .top h1 { margin: 0; color: var(--tk-ink); font-size: var(--tk-fs-page); line-height: var(--tk-lh-page); font-weight: 500; letter-spacing: 0; outline: none; }
  .lede { margin: 0.5rem 0 0; color: var(--muted); }
  .back, .sec-head a, .more { display: inline-flex; align-items: center; min-height: 2.75rem; color: var(--accent); font-weight: 400; text-decoration: none; }
  h2 { font-size: 1.375rem; line-height: 1.25; margin: 0 0 0.75rem; }
  .icon { flex: none; display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; background: var(--area, var(--muted)); }
  .icon svg { width: 1.125rem; height: 1.125rem; fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* Today, as the approved prototype draws it from ui.css's parts: the title row with the light-or-dark button, Up next (the one ask that matters most: its question, its project, time and
     the answer recommended, then Answer in ink beside Other answer), the next three asks waiting on you, and two tiles, Cleared today and Proofs today. */
  .t-up .lab { flex: 1; min-width: 0; }
  .t-up .q { display: -webkit-box; overflow: hidden; margin: 0.25rem 0 0; color: var(--tk-ink); font-size: var(--tk-fs-head); line-height: 1.5rem; font-weight: 500; letter-spacing: -0.014em;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .t-up .meta { display: flex; align-items: center; gap: 0.5rem; height: 1.25rem; margin: 0.5rem 0 0; overflow: hidden; color: var(--tk-text-tertiary); font-size: var(--tk-fs-meta); line-height: 1.25rem; white-space: nowrap; }
  .t-up .meta > span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .t-up .meta img, .t-up .meta .mono { flex: none; width: 1rem; height: 1rem; border-radius: 0.25rem; object-fit: cover; }
  .t-up .meta .mono { background: var(--tk-ink); color: var(--tk-raised); font-size: 0.4375rem; line-height: 1rem; font-weight: 600; text-align: center; }
  .t-up .err { margin-top: 0.5rem; }
  /* Up next's buttons: 44px pills side by side, the main one in ink; one alone takes the row. */
  .t-btns { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0.5rem; margin-top: 1rem; }
  .t-btn { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; height: 2.75rem; padding: 0 1rem; border: 0; border-radius: 1.375rem; font: inherit;
    font-size: var(--tk-fs-row); line-height: var(--tk-lh-row); font-weight: 500; letter-spacing: -0.006em; text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; transition: transform 120ms var(--ease); }
  .t-btn > .lbl { overflow: hidden; text-overflow: ellipsis; }
  .t-btn:active { transform: scale(0.97); }
  .t-btn.ink { background: var(--tk-ink); color: var(--tk-canvas); }
  .t-btn.white { background: var(--tk-raised); color: var(--tk-ink); box-shadow: var(--tk-elev-raised); }
  .t-btn:disabled { cursor: default; }
  .t-btn.ink:disabled { background: var(--tk-ink); color: var(--tk-canvas); } .t-btn.white:disabled { background: var(--tk-raised); color: var(--tk-ink); }
  :is(.today-top, .t-up, .t-wait, .t-tiles, .t-sheet) :focus-visible { outline-color: var(--tk-ink); }
  .t-btn:disabled:not(.done) { opacity: 0.35; }
  @media (prefers-color-scheme: dark) { .t-btn.white, .t-btn.white:disabled { background: var(--tk-on); } }
  /* Answered here, the ink button draws a check; then the next ask rises into the card. */
  .t-btn .okmark { position: absolute; inset: 0; display: none; place-items: center; }
  .t-btn .okmark .glyph { width: 1.25rem; height: 1.25rem; stroke-width: 2.6; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw 260ms 90ms var(--ease) forwards; }
  .t-btn.done > .lbl { visibility: hidden; } .t-btn.done .okmark { display: grid; }
  .t-up.next > * { animation: lead-in 260ms var(--ease); }
  @keyframes lead-in { from { opacity: 0; transform: translateY(0.875rem); } }
  /* Today's two tiles carry the prototype's filled marks. */
  .t-tiles .si svg { fill: currentColor; stroke: none; }
  .t-tiles .ui-stat { -webkit-tap-highlight-color: transparent; transition: transform 120ms var(--ease); } .t-tiles .ui-stat:active { transform: scale(0.97); }
  /* More (the line under the tiles) and Search (the dock's round button) open a sheet from the bottom: its handle, its name and a round close, then its rows on a sunk ground. */
  .t-sheet { width: 100%; max-width: 26.875rem; max-height: calc(100dvh - 3rem); margin: auto auto 0; padding: 0; border: 0; border-radius: 1.75rem 1.75rem 0 0; background: var(--tk-card); color: var(--tk-text);
    box-shadow: var(--tk-elev-sheet); overscroll-behavior: contain; }
  .t-sheet[open] { animation: sheet-up 250ms var(--ease); }
  .t-sheet::backdrop { background: var(--tk-scrim); }
  .t-sheet::before { content: ""; display: block; width: 2.25rem; height: 0.25rem; margin: 0.5rem auto 0; border-radius: 2px; background: var(--tk-line); }
  .t-sheet > div { padding: 0.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom)); }
  .t-shd { display: flex; align-items: center; gap: 0.5rem; height: 2.5rem; }
  .t-shd h2 { flex: 1; min-width: 0; margin: 0; color: var(--tk-text-tertiary); font-size: var(--tk-fs-row); line-height: 1.5rem; font-weight: 400; letter-spacing: -0.006em; outline: none; }
  .t-shd .x { position: relative; display: grid; flex: none; place-items: center; width: 2rem; height: 2rem; padding: 0; border: 0; border-radius: 1rem; background: var(--tk-inset); color: var(--tk-text-secondary); }
  .t-shd .x::after { content: ""; position: absolute; inset: -0.375rem; }
  .t-shd .x .glyph { width: 1rem; height: 1rem; }
  .t-find { display: flex; align-items: center; gap: 0.5rem; height: 2.75rem; margin-top: 1rem; padding: 0 0.5rem 0 1rem; border-radius: 1.375rem; background: var(--tk-inset); color: var(--tk-text-tertiary); }
  .t-find svg { flex: none; width: 1.125rem; height: 1.125rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .t-find input { flex: 1; min-width: 0; height: 2.75rem; padding: 0; border: 0; background: none; color: var(--tk-ink); font: inherit; font-size: 0.9375rem; outline: none; -webkit-appearance: none; appearance: none; }
  .t-find input::placeholder { color: var(--tk-text-tertiary); }
  .t-find input::-webkit-search-cancel-button { display: none; }
  .t-grp { margin: 1.25rem 0 0.5rem; color: var(--tk-text-tertiary); font-size: var(--tk-fs-row); line-height: 1.25rem; }
  .t-sheet .ui-list { background: var(--tk-inset); box-shadow: none; border-radius: 1rem; }
  .t-sheet .ui-icon { box-shadow: none; }
  .t-sheet .ui-props { margin-top: 1rem; }
  .t-sheet .ui-pr .v .glyph { color: var(--tk-text-tertiary); }
  .t-sheet .ui-seg { margin-top: 0.5rem; }
  .t-line { margin: 0.5rem 0 0; color: var(--tk-text-tertiary); font-size: var(--tk-fs-meta); line-height: 1.25rem; }
  .t-sheet .ask { margin-top: 1rem; }
  .t-sheet .ask > summary, .t-sheet .ask .actions button { color: var(--tk-ink); }
  .t-sheet .ask .actions button { background: var(--tk-inset); }
  /* A row's second line sits 4px under its title, as ui.css spaces it, not at the board's older line spacing. */
  :is(.t-wait, .t-sheet) .ui-row .meta { margin: 0; }
  /* The round light-or-dark button (Today's and Decide's heads) stays a 40px circle with its icon centred: the board's older button rule would make it 44px tall and pad it. */
  .ui-top > .ui-rb { min-height: 0; padding: 0; }
  .ui-top > .ui-rb .glyph { width: 1.25rem; height: 1.25rem; stroke-width: 1.6; }
  /* Under the tiles, one quiet line opens More. */
  .t-more-line { display: flex; align-items: center; justify-content: center; gap: 0.25rem; width: 100%; min-height: 2.75rem; margin-top: 1rem; padding: 0 1rem; border: 0; border-radius: 1.375rem;
    background: none; color: var(--tk-text-tertiary); font: inherit; font-size: var(--tk-fs-meta); line-height: 1.25rem; -webkit-tap-highlight-color: transparent; }
  .t-more-line > span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .t-more-line .glyph { width: 1rem; height: 1rem; }
  .t-more-line:active { background: var(--tk-inset); }
  /* Cards, a run's result mark and its check badge (Decide's answered ask), and the small segmented control (the full screen's sizes). */
  .card { background: var(--surface); border-radius: var(--r-card); }
  .card { padding: var(--tk-sp-4); }
  .res { display: inline-flex; align-items: center; gap: 0.3125rem; font-weight: 600; }
  .res::before { content: ""; width: 0.4375rem; height: 0.4375rem; border-radius: 50%; background: currentColor; }
  .res.ok { color: var(--ok); } .res.bad { color: var(--danger); } .res.warn { color: var(--warn); } .res.none::before { display: none; }
  .donek { display: grid; flex: none; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--tk-fill); color: var(--tk-card); }
  .donek .glyph { width: 1.125rem; height: 1.125rem; stroke-width: 2.6; }
  .donek.bad { background: var(--tk-p0); color: var(--tk-p0-text); } .donek:is(.warn, .none) { background: var(--sunk); color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--sunk); border-radius: 0.5625rem; padding: 2px; }
  .seg button { min-height: var(--ctl); border: 0; border-radius: 0.4375rem; background: none; color: var(--text); font: inherit; font-size: var(--t-xs); line-height: 1.2; padding: 0.25rem 0.375rem; }
  .seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: var(--tk-elev-raised); color: var(--text); font-weight: var(--tk-fw-semibold); }
  .seg button[aria-pressed="true"]::before { content: none; }

  /* Reports: a grouped list under small section heads, a row per report: its picture, title, what it says, then its kind, steps and date.
     A dot marks one filed today. A row with steps draws them as numbered nodes on a line, with only the marks that matter under each. */
  .report { scroll-margin-top: 4.5rem; }
  .rows.reports > li, .rows.reports .compact { align-items: start; }
  .rows.reports .when { margin-top: 0.1875rem; line-height: 1.3571; color: var(--muted); font-size: 0.875rem; }
  .rows.reports .flow { margin-top: 0.625rem; max-width: 20rem; }
  .rows.reports .done > :not(summary) { margin: 0 0 1rem 4.25rem; }
  .sec-h:has(+ .reports) { margin: 1.75rem 0 0.5rem; padding: 0 1rem; }
  .rows.reports .compact > .t > .meta { font-size: 0.9375rem; line-height: 1.3333; letter-spacing: -0.016em; }
  .sec-h:has(+ .reports) h2 { color: var(--muted); font-size: 0.875rem; line-height: 1.35; font-weight: 400; letter-spacing: 0.02em; text-transform: uppercase; }
  /* Each row's picture is a 60px tile holding one line icon for what the report explains with; a hairline starts under the words, not the picture. */
  .rows.reports .rth { display: grid; flex: none; place-items: center; width: 3.75rem; height: 3.75rem; border-radius: 0.75rem; background: var(--sunk); color: var(--muted); overflow: hidden; }
  .rows.reports .rth svg { width: 3.25rem; height: 3.25rem; }
  .rows.reports .rth .icon { width: auto; height: auto; background: none; } .rows.reports .rth .icon svg { width: 1.75rem; height: 1.75rem; stroke: var(--muted); }
  #reader .read > .dis { min-height: 2.75rem; margin-top: 1rem; padding: 0 0.5rem; border: 0; background: none; color: var(--muted); }
  .rows.reports > li + li { position: relative; border-top: 0; }
  .rows.reports > li + li::before { content: ""; position: absolute; top: 0; right: 0; left: 4.5rem; border-top: 0.5px solid var(--line); }
  .st { display: inline-flex; flex: none; align-items: center; gap: 0.375rem; padding: 0.125rem 0.625rem; border-radius: 999px; background: var(--sunk);
    font-size: 0.875rem; font-weight: 650; white-space: nowrap; }
  .st::before { content: ""; width: 0.4375rem; height: 0.4375rem; border-radius: 50%; background: currentColor; }
  .st.ok { color: var(--ok); } .st.new { color: var(--c-reports); } .st.bad { color: var(--danger); } .st.warn { color: var(--warn); }
  .decided .lbl { display: block; color: var(--muted); font-size: 0.875rem; font-weight: 650; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; margin: 1.5rem 0 0.75rem; }
  .sec-h h2, .sec-h .meta { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; margin: 0 0 0.75rem; padding: 0.625rem 1rem; color: var(--muted); font-size: 0.875rem; }
  .legend > span, .marks { display: inline-flex; align-items: center; gap: 0.375rem; }
  /* At phone width the four marks fit on one row. */
  @media (max-width: 30rem) { .legend { justify-content: space-between; gap: 0.25rem 0.5rem; padding: 0.625rem 0.75rem; } .legend > span { gap: 0.3125rem; } }
  .marks { flex-wrap: wrap; justify-content: center; gap: 0.25rem; }
  /* A mark is its shape; in the legend and the open steps list it sits in a small rounded badge. */
  .mk { display: inline-grid; place-items: center; }
  .mk::before { content: ""; width: 0.5rem; height: 0.5rem; background: var(--c); }
  .mk-ai { --c: var(--c-reports); } .mk-ai::before { border-radius: 50%; }
  .mk-store { --c: var(--c-evidence); } .mk-store::before { border-radius: 1px; }
  .mk-gate { --c: var(--c-gate); } .mk-gate::before { transform: rotate(45deg) scale(0.85); }
  .mk-fail { --c: var(--danger); } .mk-fail::before { width: 0.75rem; height: 0.3125rem; border-radius: 2px; }
  .legend .mk, .steps .mk { width: 1.375rem; height: 1.375rem; border: 1px solid var(--border); border-radius: 0.4375rem; background: var(--sunk); }
  .flow, .steps { display: grid; margin: 0; padding: 0; list-style: none; }
  .flow { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .flow li { position: relative; display: grid; justify-items: center; align-content: start; gap: 0.375rem; }
  .flow li + li::before { content: ""; position: absolute; top: 0.8125rem; right: 50%; width: 100%; border-top: 2px solid var(--line); }
  .num { position: relative; z-index: 1; display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border: 2px solid var(--muted); border-radius: 50%;
    background: var(--surface); font-size: 0.875rem; font-weight: 700; }
  .steps { gap: 0.75rem; }
  .steps .mk { width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; }
  .steps .mk::before { width: 0.75rem; height: 0.75rem; }
  .steps .mk-fail::before { width: 0.9375rem; height: 0.375rem; }
  .steps li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.75rem; font-weight: 600; }
  .report .rung > .meta { display: none; }
  /* A report opens over the whole board, on a phone and a desk alike: a bar with the way back, then its page. */
  #reader { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; background: var(--bg); }
  #reader[hidden] { display: none; }
  #reader header { display: flex; align-items: center; gap: 0.5rem; min-height: 3.5rem; padding: 0.25rem 1rem; }
  #reader .close { display: inline-flex; flex: none; align-items: center; min-height: 3rem; margin-left: -0.5rem; padding: 0 0.5rem; border-radius: 0.625rem; color: var(--accent); font-weight: 400; text-decoration: none; }
  :is(#reader header, .split-bar) .change-link { display: inline-flex; align-items: center; justify-content: center; width: 2.75rem; height: 2.75rem; margin-left: auto; border-radius: 0.625rem; color: var(--accent); }
  :is(#reader header, .split-bar) .change-link svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #reader header h1 { margin: 0; min-width: 0; overflow: hidden; font-size: 1rem; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  #reader iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  /* A title takes the focus from script when a screen opens; it shows a ring only when the last input was a key. */
  h1[tabindex="-1"] { outline: none; }
  html[data-kbd] h1[tabindex="-1"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* A report reads as a page of its own: what it is and when, its title in large type, what it says, then its page in a tile. */
  #reader .read { flex: 1; min-height: 0; overflow: auto; padding: 0 1.25rem 2rem; }
  #reader .read > * { max-width: 42.5rem; margin-left: auto; margin-right: auto; }
  #reader .read .eyebrow { margin-top: 0.5rem; font-weight: 400; }
  #reader .read h1 { margin-top: 0.75rem; margin-bottom: 0.75rem; font-size: 2.125rem; line-height: 1.1765; font-weight: 700; letter-spacing: 0.011em; white-space: normal; overflow: visible; }
  #reader .read .about { margin-bottom: 1rem; font-size: 1.25rem; line-height: 1.4; }
  #reader .read .decided { margin-bottom: 1.25rem; }
  :is(#reader, .split-detail) .read iframe { display: block; width: 100%; max-width: none; height: 1px; flex: none; border-radius: 1rem; background: var(--surface); }
  .i-plan { --area: var(--c-waiting); }
  #reader .plan-scroll { flex: 1; min-height: 0; overflow: auto; padding: 1.25rem 1.25rem 9rem; }

<script>
  let state = { decisions: [], answers: {} };
  // An exported copy carries its state and files inline and is read-only.
  const FROZEN = window.FROZEN, src = (url) => FROZEN?.files[url] ?? url;
  // Typed notes not yet sent, kept across re-renders and reloads in this browser, per board file.
  const drafts = new Map(), stored = () => `sign-off-drafts ${state.file}`;
  const keep = () => { try { localStorage.setItem(stored(), JSON.stringify([...drafts])); } catch {} };
  let loaded = false;
  // Text goes in as text nodes, never as HTML, so a title from the file can't run code.
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    e.append(...kids);
    return e;
  };

  // Motion and touch: reduced motion makes every wait instant; a haptic tick (Android only) marks a swipe's commit line, a saved answer and an Undo.
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const pause = (ms) => new Promise((ok) => setTimeout(ok, calm.matches ? 0 : ms));
  const HAPTIC = { tick: 10, success: [12, 70, 22], undo: [8, 40, 8] };
  const buzz = (kind) => { try { navigator.vibrate?.(HAPTIC[kind]); } catch {} };

  document.documentElement.style.setProperty('--spring', (() => {

  /** sent runs only once the server saved the request, so a draft is dropped only then; the redraw waits for it (an answer's check plays out before the list comes back). */
  async function call(path, init, sent) {
    const res = await fetch(path, init);
    const body = await res.json().catch(() => ({ error: `The server replied ${res.status}` }));
    if (!res.ok) throw Object.assign(new Error(body.error), { status: res.status });

    if (!loaded) {
      loaded = true;
      try { for (const [k, v] of JSON.parse(localStorage.getItem(stored())) ?? []) drafts.set(k, v); } catch {}

    await sent?.();
    renderKeepingFocus();
  }

  // A response can arrive after the person has started typing on the next card.
  // Keep the active editor and its selection across that redraw, just as a poll does.
  function renderKeepingFocus() {
    const typing = (document.activeElement?.tagName === 'TEXTAREA' || document.activeElement?.id === 'find') && document.activeElement;
    const start = typing && typing.selectionStart, end = typing && typing.selectionEnd, direction = typing && typing.selectionDirection;
    render();
    const box = typing && document.getElementById(typing.id);

  }

  function lock(...btns) {
    const controls = [...btns, ...(btns[0].closest('.decide, .row')?.querySelectorAll('button') ?? [])].filter((b) => !b.disabled);
    controls.forEach((b) => (b.disabled = true));
    return () => controls.forEach((b) => (b.disabled = false));
  }

  // `words` names the draft the note is read from: the card's box, or Decide's Your own answer, which it keeps apart from the note.
  async function save(d, o, buttons, err, after, land, words = d.key) {
    const unlock = lock(...buttons);
    // An answers-only board takes no comments, and words sent as the answer are the answer itself (a reply item's also go as a comment).
    const typed = state.answers_only || (o.value === 'text' && !d.reply) ? '' : (drafts.get(d.key) ?? '').trim();
    const note = drafts.get(words) ?? noteOf(d), before = answerOf(d.key);
    const drop = clearIfSaved(words, drafts.get(words));
    try {
      await call('/api/answers', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: d.key, answer: o.value, note }),
      }, async () => { forget(d.key); unfolded.delete(d.key); if (!typed) drop(); await land?.(); });
    } catch (e) {
      buttons.forEach((b) => b.classList.remove('done'));
      shown(err).textContent = `Couldn't save: ${e.message}`;
      return unlock();
    }
    offerUndo(d, before);
    after?.();
    if (typed) call('/api/messages', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: 'comment', key: d.key, text: typed }),
    }, drop).catch(() => say('Could not save your comment', 8000));

  const toast = document.getElementById('toast'), toastText = document.getElementById('toast-text'), undoBtn = document.getElementById('undo');
  let hide;
  const answerOf = (key) => (Object.hasOwn(state.answers, key) ? state.answers[key] : undefined);
  // The saved note, for the next pick or round. Words sent as the answer are that answer, not a note to carry over;
  // a reply item's reply still goes with the answer picked after it.
  const noteOf = (d) => (answerOf(d.key)?.answer === 'text' && !d.reply ? '' : answerOf(d.key)?.note ?? '');
  // The toast stays while the pointer is on it or the keyboard is on Undo.
  const later = (ms) => { clearTimeout(hide); hide = setTimeout(() => (toast.matches(':hover') || undoBtn.matches(':focus-visible') ? later(1500) : (toast.hidden = true)), ms); };

  const placeToast = () => {
    toast.style.bottom = '';
    const bar = document.querySelector('.decide-bar')?.getBoundingClientRect(), t = toast.getBoundingClientRect();
    if (!toast.hidden && bar?.height && t.bottom > bar.top && t.top < bar.bottom) toast.style.bottom = `${innerHeight - bar.top + 8}px`;

  // The words may lead with what they are about in bold, as in "<b>Keep the weekly digest?</b> · Yes".
  const say = (text, ms, undo, mark) => {
    toastText.replaceChildren(...[text].flat());

    void toast.offsetWidth;
    toast.hidden = false;
    placeToast();
    later(ms);
  };

  function offerUndo(d, before) {
    const now = answerOf(d.key);
    if (!now) return;
    undoBtn.setAttribute('aria-label', `Undo, ${headline(d)}`);
    buzz('success');
    say([el('b', {}, headline(d)), ` · ${before ? 'changed to ' : ''}${now.answer === 'text' ? 'your reply' : now.label}${now.note && now.answer !== 'text' ? ' · with your comment' : ''}`], 5000, () => {
      undoBtn.disabled = true;
      // On the Decide list the row comes back in place, with a flash; anywhere else the ask opens again.
      // On Today it comes back as Up next.
      const list = location.hash === '#waiting', home = !location.hash.slice(1);
      if ((list || !phone()) && !before) returned(d.key);
      call('/api/answers', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ key: d.key, answer: before?.answer ?? '', note: before?.note ?? '' }) })
        .then(() => {

      // The page stays; the head, the list, the report's head line and its parts beside it are drawn again.
      for (const part of ['.ui-dhead', '.split-list', '.split-detail > .split-bar', '.split-detail > .pside']) document.querySelector(`#board ${part}`).replaceWith(content[0].querySelector(part));
    } else board.replaceChildren(...content);
    // A redraw keeps the desk list where it was scrolled, with the selected row in view.
    const listEl = document.querySelector('.split-list');
    if (listEl && listTop) listEl.scrollTop = listTop;
    listEl?.querySelector('[data-row][aria-current]')?.scrollIntoView({ block: 'nearest' });
    if (!toast.hidden) placeToast();
    if (at === 'reports' && !key) rpRisen = true;
    if (rpSel !== null) rpRisen = true;
    readPage(rpFull ? shownReport : key && !(deskSplit && (at === 'evidence' || at === 'reports')) && !(at === 'designs' && !phone()) ? state.decisions.find((d) => d.key === key && !gone.has(d.key) && (at === 'reports' && reads(d) || at === 'designs' && d.kind === 'design' || at === 'evidence' && d.type === 'evidence' || d.type === 'plan' && (area(d) === at || (d.guided && (at === 'waiting' || at === 'answered'))))) : undefined, rpFull ? location.hash.slice(1) : at);
    fold();
    applyPicks();
    if (FROZEN) freeze();
    if (document.querySelector('.tk-desk')) requestAnimationFrame(tkSettle), document.fonts.ready.then(tkSettle);
    if (document.querySelector('.ui-desk')) requestAnimationFrame(uiSettle), document.fonts.ready.then(uiSettle);
  }
  function freeze() {
    // Answers stay as they are, but nothing in the copy can be sent.
    document.querySelectorAll('#board .choices button, #board .pick-list button, #board .decide-bar .answer, #board .t-up button, #board .mock button, #board .note button, #board .note textarea').forEach((e) => (e.disabled = true));
    // A browser will not open a data: link in a new tab; the inline preview is the copy.
    document.querySelectorAll('#board a[href^="data:"]').forEach((a) => a.removeAttribute('href'));
  }
  // Typing in a box is not moving around by keyboard (a phone's keyboard sends keys too); Tab out of it is.
  addEventListener('keydown', (e) => { if (e.key === 'Tab' || !e.target.closest?.('textarea, input, select')) document.documentElement.dataset.kbd = ''; }, true);
  addEventListener('pointerdown', () => delete document.documentElement.dataset.kbd, true);
  // A new screen starts at its top, or at the item tapped on the Summary, with the focus on its title.
  // Closing a report or plan goes back to its card, with the focus on its link; an open report takes the focus on its title.
  // On a phone an ask pushes in from the right over Decide, and going back (or answering) slides the list in from the left; the list's rows rise in when the tab opens.
  let lastHash = location.hash;
  // Crossing 64rem swaps the phone's stack for the desk's list beside its ask, and back.
  matchMedia('(max-width: 63.999rem)').addEventListener('change', () => loaded && render());
  addEventListener('hashchange', () => {
    const back = !reader.hidden && reader.dataset.key, from = lastHash, ask = /^#decide\//;
    lastHash = location.hash;
    // A ticket's Back returns to the card its row was tapped on; from one ticket to another it keeps that card.
    if (/^#ticket\//.test(location.hash) && !/^#ticket\//.test(from)) ticketBack = from;
    if (jump && location.hash === '#waiting') jump = null;
    if (location.hash === '#waiting' && !ask.test(from)) risen = false;
    if (location.hash === '#reports' && !/^#reports\//.test(from)) rpRisen = false;
    selecting = false, picked.clear();
    // On a desk the new detail slides in from the side the selection moved.
    const rowsOf = () => [...document.querySelectorAll('.split-list [data-row]')], order = rowsOf().map((r) => r.getAttribute('href')), was = rowsOf().findIndex((r) => r.matches('[aria-current]'));
    render();
    rpPicked = false;
    if (!phone()) {
      const detail = document.querySelector('.split-detail'), now = document.querySelector('.split-list [data-row][aria-current]')?.getAttribute('href');
      if (detail && was >= 0 && now && now !== order[was] && !calm.matches) detail.dataset.dir = order.indexOf(now) >= 0 && order.indexOf(now) < was ? 'up' : 'down', detail.classList.add('in');
    }
    // On a phone an ask's sheet rises over Decide's list and closes back to it: the list stays where it was scrolled.
    const overList = phone() && [location.hash, from].every((h) => h === '#waiting' || ask.test(h));
    if (!reader.hidden) { scrollTo(0, 0); return reader.querySelector('h1').focus({ preventScroll: true }); }
    const item = (jump || back) && document.getElementById(`item-${jump || back}`);
    jump = null;
    // Opening or closing a ticket over Tickets' list leaves the list where it was, as an ask over Decide's does.
    const tix = /^#tickets?(\/|$)/;
    item ? item.scrollIntoView() : overList || (tix.test(from) && tix.test(location.hash)) ? '' : scrollTo(0, 0);
    // A Decide row is itself the link back to its page.
    // On a desk the focus stays on the selected row, so J, K and Enter carry on from it.
    // An ask's sheet takes the focus on its question; closed, the focus goes back to the row it was opened from.
    ((back && (item?.matches('a.dl-face') ? item : item?.querySelector('h3 a, .open-link, a.compact'))) || document.querySelector('.ask-sheet #ask-title') || document.querySelector('.tk-sheet .tk-dt')
      || (overList && ask.test(from) && document.getElementById(`item-${from.slice(8)}`)) || document.querySelector('.split-list [data-row][aria-current]') || document.querySelector('#board h1')).focus({ preventScroll: true });
  });
  // An interactive page may post its own height, `{ height: <px> }`, and its frame then fits it with no blank below.
  // Only a frame's own message sizes it. Document readers must fit even long pages; previews stay capped.
  addEventListener('message', (e) => {
    const frame = [...document.querySelectorAll('.rung iframe, iframe.plan-view, :is(#reader, .split-detail) .read iframe, .gd-dgbox:not(.full) iframe')].find((f) => f.contentWindow === e.source), h = e.data?.height;
    const documentFrame = frame?.matches('iframe.plan-view, :is(#reader, .split-detail) .read iframe, .gd-dgbox iframe');
    if (documentFrame && e.data?.['sign-off'] === 'ready') {
      frame.scrolling = 'no';
      frame.contentWindow.postMessage({ 'sign-off': 'size' }, '*');
    }
    if (frame && Number.isFinite(h) && h > 0) frame.style.height = `${Math.ceil(documentFrame ? h : Math.min(h, 10_000))}px`;
  });
  // A design mock page may point (web/point.js): the board keeps the last element named per mock, and turns pointing on for one mock frame.
  const pointing = new Map(), pointed = new Map();
  const mockFrame = (source) => [...document.querySelectorAll('.mock iframe')].find((f) => f.contentWindow === source);
  const aim = (frame) => {
    const on = talks() && pointing.get(frame.dataset.mock) === true;
    frame.style.pointerEvents = on ? 'auto' : '';
    frame.parentElement.classList.toggle('aiming', on);
    frame.contentWindow.postMessage({ 'sign-off': 'point', on }, '*');
  };
  function point(frame, on) {
    pointing.set(frame.dataset.mock, on);
    aim(frame);
  }
  // While pointing is on, a tap never opens the mock full size, even one that reaches the board instead of the frame:
  // one on the frame's edge, one the browser sends there until it has drawn the frame taking taps, or one before a frame drawn anew is ready.
  addEventListener('click', (e) => {
    const frame = e.target.closest?.('.shot')?.querySelector('iframe[data-mock]');
    if (frame && talks() && pointing.get(frame.dataset.mock) === true) e.preventDefault();
  });
  addEventListener('message', (e) => {
    const frame = mockFrame(e.source), msg = e.data;
    if (!frame || !msg) return;
    if (msg['sign-off'] === 'ready') aim(frame);
    if (msg['sign-off'] !== 'pointed' || !['ref', 'tag', 'text'].every((k) => typeof msg[k] === 'string')) return;
    pointed.set(frame.dataset.mock, { ref: msg.ref, tag: msg.tag, text: msg.text });
    // The element named opens the comment editor on its card, with its saved comment when it has one.
    const dm = frame.dataset.mock, cut = dm.indexOf('~'), d = state.decisions.find((x) => x.key === dm.slice(0, cut));
    if (!d || !talks() || pointing.get(dm) !== true) return;
    const mock = dm.slice(cut + 1);
    editing.set(d.key, { mock, hash: d.mocks?.find((m) => m.value === mock)?.hash, ref: msg.ref, tag: msg.tag, words: msg.text });
    redraw(d);
    document.getElementById(`ann-text-${d.key}`)?.focus();
  });

  const banner = document.getElementById('banner');
  const failed = (e) => {
    banner.textContent = `Can't read the board file: ${e.message}`;
    banner.hidden = false;
  };
  // Another program can change the board file (a feed, a new sign-in, signin done), so the page checks it every 20 seconds and redraws only on a change.
  async function refresh() {
    try {
      const res = await fetch('/api/decisions'), body = await res.json().catch(() => ({ error: `The server replied ${res.status}` }));
      if (!res.ok) throw new Error(body.error);
      banner.hidden = true;
      if (JSON.stringify(body) === JSON.stringify(state)) return;
      state = body;
      renderKeepingFocus();
    } catch (e) { failed(e); }
  }
  if (FROZEN) (state = FROZEN), render();
  else call('/api/decisions').then(() => {
    banner.hidden = true;
    setInterval(refresh, 20_000);
  }, failed);
</script>
</body>
