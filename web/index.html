<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · sign-off</title>
<style>
  :root { color-scheme: light dark;
    --bg: #F6F3EE; --surface: #FFFFFF; --sunk: #EFEBE4; --line: #E6E0D6; --text: #1F1B16; --muted: #6A6157;
    --border: #B8AE9F; --accent: #C2410C; --on-accent: #FFFFFF; --danger: #B42318;
    --shadow: 0 1px 2px rgb(60 40 20 / 0.06), 0 6px 18px rgb(60 40 20 / 0.06); }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #15120F; --surface: #211D18; --sunk: #1B1814; --line: #342E26; --text: #F3EEE6; --muted: #A99F91;
    --border: #6E6458; --accent: #FB923C; --on-accent: #1A1009; --danger: #FF8A80;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.25); } }
  * { box-sizing: border-box; }
  body { margin: 0 0 3rem; background: var(--bg); color: var(--text); overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
    font: 1rem/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); }
  .bar, main { max-width: 55rem; margin: 0 auto; padding: 0 1rem; }
  .bar { display: flex; align-items: center; gap: 0.625rem; min-height: 3.5rem; flex-wrap: wrap; }
  .bar h1 { font-size: 1rem; font-weight: 600; margin: 0; flex: 1 0 auto; }
  .count { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  .banner { margin: 1rem 0 0; padding: 0.75rem 1rem; border: 1px solid var(--danger); border-radius: 0.5rem; color: var(--danger); }
  h2 { font-size: 0.75rem; font-weight: 700; color: var(--muted); margin: 2rem 0 0.625rem; letter-spacing: 0.06em; text-transform: uppercase; }
  /* The glance: what waits, by type, oldest first; the chips filter the lists below and live in the URL hash. */
  .glance { padding-top: 1.25rem; }
  .big { margin: 0; font: 600 1.625rem/1.2 ui-serif, "Iowan Old Style", Georgia, serif; letter-spacing: -0.01em; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.875rem; }
  .filters button { min-height: 2.5rem; padding: 0 0.625rem; border-radius: 999px; border-color: var(--line); font-size: 0.875rem; }
  .filters .n { margin-left: 0.375rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .filters button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .filters button[aria-pressed="true"] .n { color: inherit; }
  .filters button[aria-pressed="true"]::before { content: none; }
  .oldest { list-style: none; margin: 0.375rem 0 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 0.875rem; box-shadow: var(--shadow); }
  .oldest .chip { min-width: 5.75rem; text-align: center; }
  .oldest li + li { border-top: 1px solid var(--line); }
  .oldest button { display: flex; align-items: flex-start; gap: 0.625rem; width: 100%; padding: 0.625rem 0.875rem; border: 0; border-radius: 0;
    background: none; text-align: start; font-weight: 500; }
  .glance > .meta { margin-top: 1rem; }
  .list { display: grid; gap: 0.75rem; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.875rem; padding: 1rem; scroll-margin-top: 4.5rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 0.875rem; box-shadow: var(--shadow); }
  /* Waiting cards carry the accent stripe and the shadow; answered ones sit flat and quiet. */
  .waiting .row { box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
  .answered .row { background: transparent; box-shadow: none; }
  .answered .row h3 { color: var(--muted); font-weight: 500; }
  .row h3 { font-size: 1.125rem; font-weight: 650; line-height: 1.35; margin: 0; }
  .about, details p { margin: 0.375rem 0 0; max-width: 70ch; }
  details p { color: var(--muted); }
  .about { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row:has(details:not(.note)[open]) .about { display: none; }
  .about.full { display: block; }
  summary { cursor: pointer; color: var(--accent); font-size: 0.875rem; margin-top: 0.25rem; width: fit-content; }
  .meta { color: var(--muted); font-size: 0.8125rem; margin: 0.5rem 0 0; }
  .evidence { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; background: color-mix(in srgb, var(--accent) 5%, var(--bg)); }
  .evidence-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .evidence-head h4 { margin: 0; font-size: .9rem; letter-spacing: .02em; }
  .verdict { border-radius: 999px; padding: .2rem .65rem; font-size: .75rem; font-weight: 700; background: var(--line); }
  .verdict[data-result="RUN PASS"] { color: #147a4a; background: #dff5e9; }
  .verdict[data-result="RUN FAIL"] { color: #a32020; background: #fde5e2; }
  .verdict[data-result="INCONCLUSIVE"], .verdict[data-result="UNVERIFIED"] { color: #79510d; background: #fff1cc; }
  .checks { display: grid; gap: .5rem; margin: .9rem 0; }
  .check { margin: 0; color: var(--muted); font-size: .875rem; }
  .check strong { color: var(--text); text-transform: capitalize; }
  .commit { color: var(--muted); font: .75rem/1.5 ui-monospace, monospace; overflow-wrap: anywhere; margin: .5rem 0; }
  /* Each capture keeps its own shape: the frame is the shot, bounded in height, never letterboxed. */
  .media { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .75rem; }
  .media a { display: block; max-width: 100%; color: var(--accent); cursor: zoom-in; }
  .media img, .media video { display: block; width: auto; height: auto; max-width: 100%; max-height: min(28rem, 70vh);
    border: 1px solid var(--line); border-radius: .625rem; background: var(--sunk); }
  .unverified, .media .gone { color: var(--danger); margin: .5rem 0; }
  .update-media { grid-column: 1 / -1; }
  /* An explainer's chapters: one tap jumps the video to that part and plays it. */
  .chapters { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.375rem; margin: -0.25rem 0 0; padding: 0; list-style: none; }
  .chapters button { min-height: 2.5rem; padding: 0 0.75rem; border-radius: 999px; border-color: var(--line); font-size: 0.875rem; }
  .chapters .at { margin-right: 0.375rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta a { color: var(--accent); }
  .err:empty { display: none; }
  .err:not(:empty) { color: var(--danger); font-size: 0.875rem; margin-top: 0.5rem; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .choices button { padding: 0 0.75rem; }
  button { min-height: 2.75rem; padding: 0 1.25rem; border-radius: 0.5rem; border: 1px solid var(--border); cursor: pointer;
    background: var(--surface); color: var(--text); font: inherit; font-weight: 500; }
  /* Recommended is a dashed accent outline and a tag; picked is filled with a check. They never look alike. */
  button.rec { border: 1px dashed var(--accent); }
  .tag { display: inline-block; white-space: nowrap; margin-left: 0.375rem; color: var(--accent); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  button[aria-pressed="true"] { background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); font-weight: 600; }
  button[aria-pressed="true"]::before { content: "✓" / ""; margin-right: 0.375rem; font-weight: 700; }
  button[aria-pressed="true"] .tag { color: inherit; }
  button:disabled { opacity: 0.6; cursor: progress; }
  .choices.many { display: flex; flex-wrap: wrap; }
  .choices.many button { flex: 1 1 auto; max-width: 100%; padding: 0.5rem 1rem; }
  .note label { display: block; color: var(--muted); font-size: 0.8125rem; margin-top: 0.5rem; }
  .tradeoff { margin: 0; max-width: 70ch; }
  .head { display: flex; align-items: flex-start; gap: 0.5rem; }
  .chip { flex: none; margin-top: 0.2rem; padding: 0 0.5rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
    font-size: 0.6875rem; font-weight: 600; line-height: 1.25rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .mocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 0.75rem; }
  .mock { display: flex; flex-direction: column; margin: 0; border: 1px solid var(--line); border-radius: 0.7rem; overflow: hidden; background: var(--bg); min-width: 0; }
  .mock:has([aria-pressed="true"]) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  /* A preview draws the mock at twice the card width at half size, cropped from the top, so every card is the same height. */
  .shot { position: relative; display: block; overflow: hidden; height: 11rem; background: #fff; border-bottom: 1px solid var(--line); }
  .shot iframe { position: absolute; inset: 0 auto auto 0; width: 200%; height: 200%; border: 0; transform: scale(0.5); transform-origin: 0 0; pointer-events: none; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .mock figcaption { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: auto; padding: 0.625rem 0.75rem 0.75rem; font-size: 0.875rem; }
  .mock figcaption .label { flex: 1 1 6rem; font-weight: 500; }
  .mock figcaption button { flex: 1 0 100%; }
  /* Ladder rungs: a diagram at card width, an interactive page in a sandboxed frame; a white page so drawings read in dark mode. */
  .rung { grid-column: 1 / -1; display: grid; gap: 0.25rem; justify-items: start; }
  .rung .frame { display: block; width: 100%; border: 1px solid var(--line); border-radius: 0.625rem; overflow: hidden; background: #fff; }
  .rung img { display: block; width: 100%; height: auto; max-height: 80vh; object-fit: contain; }
  /* Short on a phone so a small page leaves no tall blank; Open full size shows the rest. */
  .rung iframe { display: block; width: 100%; height: min(18rem, 50vh); border: 0; }
  .rung .gone { color: var(--danger); margin: 0; }
  .rung > .meta { color: var(--accent); margin: 0; }
  .badge { padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: var(--accent); border: 1px dashed var(--accent); }
  .round { margin-top: 0.5rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
  .ask { margin: 1rem 0 0; padding: 0.25rem 1rem 0.75rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.75rem; }
  textarea { display: block; width: 100%; max-width: 70ch; margin-top: 0.25rem; padding: 0.5rem 0.75rem; border: 1px solid var(--border);
    border-radius: 0.5rem; background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  .saved-note { white-space: pre-line; }
  button:focus-visible, summary:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .oldest button:focus-visible, .shot:focus-visible { outline-offset: -2px; }
  .empty { margin: 0; padding: 1.5rem 1rem; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 0.875rem; }
  @media (min-width: 45rem) {
    .bar, main { padding: 0 2rem; }
    .row { grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 2rem; padding: 1.125rem 1.25rem; }
    .row.design { grid-template-columns: minmax(0, 1fr); gap: 0.875rem; }
    .rung iframe { height: min(32rem, 75vh); }
    /* A picture card stacks like a design card: the picture, then its buttons at their own width. */
    .row:has(> .rung) { grid-template-columns: minmax(0, 1fr); gap: 0.875rem; }
    .row:has(> .rung) .choices { justify-content: start; }
    .choices { grid-template-columns: repeat(2, minmax(5.5rem, auto)); }
    .row:has(.choices.many) { row-gap: 0.875rem; }
    .choices.many { grid-column: 1 / -1; }
    .choices.many button { flex: 0 1 auto; min-width: 5.5rem; }
  }
</style>
</head>
<body>
<header><div class="bar">
  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>Dashboard</h1><span class="count" id="count" aria-live="polite"></span>
</div></header>
<main><p class="banner" id="banner" role="alert" hidden></p><div id="board"></div></main>
<script>
  let state = { decisions: [], answers: {} };
  // An exported copy carries its state and files inline and is read-only.
  const FROZEN = window.FROZEN, src = (url) => FROZEN?.files[url] ?? url;
  // Typed notes not yet sent, kept across re-renders and reloads in this browser.
  const drafts = new Map((() => { try { return JSON.parse(localStorage.getItem('sign-off-drafts')) ?? []; } catch { return []; } })());
  const keep = () => { try { localStorage.setItem('sign-off-drafts', JSON.stringify([...drafts])); } catch {} };
  // Text goes in as text nodes, never as HTML, so a title from the file can't run code.
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    e.append(...kids);
    return e;
  };

  async function call(path, init) {
    const res = await fetch(path, init);
    const body = await res.json().catch(() => ({ error: `The server replied ${res.status}` }));
    if (!res.ok) throw new Error(body.error);
    state = body;
    render();
  }

  function save(d, o, buttons, err) {
    buttons.forEach((b) => (b.disabled = true));
    const note = drafts.get(d.key) ?? state.answers[d.key]?.note ?? '';
    drafts.delete(d.key);
    keep();
    call('/api/answers', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: d.key, answer: o.value, note }),
    }).catch((e) => {
      if (!drafts.has(d.key)) drafts.set(d.key, note);
      keep();
      err.textContent = `Couldn't save: ${e.message}`;
      buttons.forEach((b) => (b.disabled = false));
    });
  }

  /** Sends a comment or a queued prompt for the agent; the typed text comes back if it fails. */
  function send(btn, err, body, draft, text) {
    btn.disabled = true;
    drafts.delete(draft);
    keep();
    call('/api/messages', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...body, text }) }).catch((e) => {
      drafts.set(draft, text);
      keep();
      err.textContent = `Couldn't send: ${e.message}`;
      btn.disabled = false;
    });
  }

  function evidenceCard(d) {
    const card = d.evidenceCard, link = d.evidence;
    if (!link) return '';
    const head = el('div', { class: 'evidence-head' }, el('h4', {}, 'Proof record'), el('span', { class: 'verdict', 'data-result': card?.result ?? 'UNVERIFIED' }, card?.result ?? 'UNVERIFIED'));
    const checks = el('div', { class: 'checks' }, ...['outcome', 'repro', 'proof', 'evidence'].map((name) =>
      el('p', { class: 'check' }, el('strong', {}, `${name}: `), document.createTextNode(link[name].replace(new RegExp(`^${name}:\\s*(?=\\S)`, 'i'), '')))));
    const media = el('div', { class: 'media' }, ...(card?.media ?? []).map((item) => {
      const node = item.type.startsWith('image/') ? el('img', { src: src(item.url), alt: `Evidence image: ${item.path}` })
        : el('video', { src: src(item.url), controls: '', playsinline: '', preload: 'metadata', 'aria-label': `Evidence recording: ${item.path}` });
      return item.type.startsWith('image/') ? el('a', { href: src(item.url), target: '_blank', rel: 'noopener', 'aria-label': `Open ${item.path}` }, node) : node;
    }));
    return el('section', { class: 'evidence', 'aria-label': 'Read-only proof evidence' }, head,
      card?.commit ? el('p', { class: 'commit' }, `Commit · ${card.commit}`) : '',
      el('p', { class: 'meta' }, 'Run result only · the lines below were not checked against this run.'),
      card?.status === 'unverified' ? el('p', { class: 'unverified' }, `Evidence unavailable · ${card.reason}`) : '', checks,
      media.childElementCount ? media : el('p', { class: 'meta' }, 'No recorded image or recording.'));
  }

  const NAMES = { decision: 'Decision', design: 'Design', evidence: 'Evidence', diagram: 'Diagram', interactive: 'Interactive', explainer: 'Explainer' };
  // Any other type gets the plain card until it has its own renderer.
  const chip = (d) => el('span', { class: 'chip' }, NAMES[d.type] ?? d.type.replace(/-/g, ' '));
  const title = (d) => (d.type === 'evidence' ? `Update ${d.number} · ${d.title}` : d.title);
  const FILTERS = { decision: 'Decisions', design: 'Designs', evidence: 'Evidence', diagram: 'Diagrams', interactive: 'Interactive pages', explainer: 'Explainers', other: 'Other' };
  const kind = (d) => (Object.hasOwn(NAMES, d.type) ? d.type : 'other');

  function row(d) {
    const err = el('div', { class: 'err', role: 'alert' });
    const saved = Object.hasOwn(state.answers, d.key) ? state.answers[d.key] : undefined;
    const design = d.type === 'design';
    const buttons = d.options.map((o) => {
      const rec = o.value === d.recommend_value && !design;
      return el('button', { class: rec ? 'rec' : '', 'aria-label': `${o.label}, ${d.title}`, 'aria-pressed': o.value === saved?.answer, ...(rec && { 'aria-describedby': `rec-${d.key}` }) },
        design ? (o.value === saved?.answer ? 'Picked' : 'Pick') : o.label, rec ? el('span', { class: 'tag', id: `rec-${d.key}` }, 'Recommended') : '');
    });
    buttons.forEach((b, i) => (b.onclick = () => save(d, d.options[i], buttons, err)));
    const head = el('div', { class: 'head' }, chip(d), el('h3', { dir: 'auto' }, title(d)));
    const silent = d.default_if_silent ? `If no answer: ${d.options.find((o) => o.value === d.default_if_silent).label}` : '';
    if (design) {
      return el('article', { class: 'row design', id: `item-${d.key}` }, head,
        d.tradeoff ? el('p', { class: 'tradeoff', dir: 'auto' }, el('strong', {}, 'Trade-off '), d.tradeoff) : '',
        mockCards(d, buttons), silent ? el('p', { class: 'meta' }, silent) : '', more(d, saved, err), err);
    }
    // Yes/No rows keep the two fixed buttons they always had; any other choice set wraps.
    const many = d.options.map((o) => o.value).sort().join() !== 'no,yes';
    const update = d.type === 'evidence';
    return el('article', { class: 'row', id: `item-${d.key}` }, el('div', {},
      head,
      d.about ? el('p', { class: d.media ? 'about full' : 'about', dir: 'auto' }, d.about) : '',
      d.detail || (!d.media && d.about?.length > 180) ? el('details', {}, el('summary', {}, 'Show more'),
        ...[d.about, d.detail].filter(Boolean).map((t) => el('p', { dir: 'auto' }, t))) : '',
      d.link ? el('p', { class: 'meta' }, /^https?:/.test(d.link)
        ? el('a', { href: d.link, target: '_blank', rel: 'noopener' }, d.link) : `Commit ${d.link}`) : '',
      silent ? el('p', { class: 'meta' }, silent) : '',
      more(d, saved, err),
      err,
    ), updateMedia(d), chapters(d), rung(d), el('div', { class: many ? 'choices many' : 'choices', role: 'group', 'aria-label': d.title }, ...buttons), evidenceCard(d));
  }

  /** The note and another-round controls, folded away until the person wants them. An evidence update takes a note only. */
  function more(d, saved, err) {
    const box = el('textarea', { id: `note-${d.key}`, rows: 2, maxlength: 500, dir: 'auto' });
    box.value = drafts.get(d.key) ?? saved?.note ?? '';
    box.oninput = () => { drafts.set(d.key, box.value); keep(); };
    const asked = (state.rounds ?? []).filter((r) => r.key === d.key);
    const comments = (state.messages ?? []).filter((m) => m.kind === 'comment' && m.key === d.key);
    const commentBtn = el('button', { 'aria-label': `Send as a comment, ${d.title}` }, 'Send as a comment');
    commentBtn.onclick = () => send(commentBtn, err, { kind: 'comment', key: d.key }, d.key, box.value.trim());
    const roundBtn = el('button', { 'aria-label': `Ask for another round, ${d.title}` }, 'Ask for another round');
    roundBtn.onclick = () => {
      roundBtn.disabled = true;
      const note = (drafts.get(d.key) ?? state.answers[d.key]?.note ?? '').trim();
      call('/api/rounds', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: d.key, note }),
      }).catch((e) => {
        err.textContent = `Couldn't ask: ${e.message}`;
        roundBtn.disabled = false;
      });
    };
    const update = d.type === 'evidence', title = update ? 'Note or comment' : 'Note, comment or another round';
    const status = [saved?.note && 'note saved', asked.length && `${asked.length} ${asked.length > 1 ? 'rounds' : 'round'} asked`,
      comments.length && `${comments.length} ${comments.length > 1 ? 'comments' : 'comment'}`].filter(Boolean).join(' · ');
    return el('details', { class: 'note', ...(drafts.has(d.key) && { open: '' }) },
      el('summary', { 'aria-label': `${title}, ${d.title}` }, `${title}${status && ` · ${status}`}`),
      asked.length ? el('p', { class: 'meta saved-note', dir: 'auto' }, `You asked for another round: ${asked[asked.length - 1].note}`) : '',
      ...comments.map((m) => el('p', { class: 'meta saved-note', dir: 'auto' }, `Your comment, ${m.delivered ? 'read by the agent' : 'not read yet'}: ${m.text}`)),
      el('label', { for: box.id }, update ? 'Optional note, sent with your verdict, or a comment for the agent'
        : 'Optional note, sent with the answer you pick or the round you ask for, or a comment for the agent'), box,
      el('div', { class: 'actions' }, update ? '' : roundBtn, FROZEN ? '' : commentBtn));
  }

  /** Free-text prompts for the agent, which it reads with sign-off-axi poll. */
  function ask() {
    const prompts = (state.messages ?? []).filter((m) => m.kind === 'prompt'), queued = prompts.filter((m) => !m.delivered).length;
    const err = el('div', { class: 'err', role: 'alert' }), box = el('textarea', { id: 'prompt', rows: 3, maxlength: 2000, dir: 'auto' });
    box.value = drafts.get('') ?? '';
    box.oninput = () => { drafts.set('', box.value); keep(); };
    const btn = el('button', { 'aria-label': 'Queue the prompt for the agent' }, 'Queue for the agent');
    btn.onclick = () => send(btn, err, { kind: 'prompt' }, '', box.value.trim());
    return el('details', { class: 'note ask', ...(drafts.get('') && { open: '' }) },
      el('summary', {}, `Ask the agent${prompts.length ? ` · ${queued} queued · ${prompts.length - queued} read` : ''}`),
      ...prompts.map((m) => el('p', { class: 'meta saved-note', dir: 'auto' }, `${m.delivered ? 'Read by the agent' : 'Queued'}: ${m.text}`)),
      el('label', { for: box.id }, 'A prompt the agent reads the next time it checks in'), box, el('div', { class: 'actions' }, btn), err);
  }

  // Each file is hash-checked by the server; one that changed or went missing says so instead of a broken frame.
  function updateMedia(d) {
    if (!d.media) return '';
    return el('div', { class: 'media update-media' }, ...d.media.map((m, i) => {
      const url = src(`/api/media?key=${encodeURIComponent(d.key)}&i=${i}`);
      const name = d.type === 'evidence' ? `Update ${d.number}, capture ${i + 1} of ${d.media.length}` : `Explainer video, ${d.title}`;
      const node = /\.(mp4|webm)$/i.test(m.path) ? el('video', { src: url, controls: '', playsinline: '', preload: 'metadata', 'aria-label': name })
        : el('a', { href: url, target: '_blank', rel: 'noopener', 'aria-label': `Open ${name}` }, el('img', { src: url, alt: name }));
      (node.tagName === 'A' ? node.firstChild : node).onerror = () => node.replaceWith(el('p', { class: 'gone' }, `${name} can't be shown: the file is missing, changed since it was posted, or in a format this browser can't play.`));
      return node;
    }));
  }

  /** An explainer's chapter list: each button starts the video at that chapter. */
  function chapters(d) {
    if (!d.chapters) return '';
    const at = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    return el('ol', { class: 'chapters', 'aria-label': `Chapters, ${d.title}` }, ...d.chapters.map((c) => {
      const b = el('button', { 'aria-label': `Play from ${at(c.at)}, ${c.title}` }, el('span', { class: 'at' }, at(c.at)), c.title);
      b.onclick = () => {
        const video = document.getElementById(`item-${d.key}`)?.querySelector('video');
        if (!video) return;
        video.currentTime = c.at;
        video.play().catch(() => {});
      };
      return el('li', {}, b);
    }));
  }

  /** A diagram shows inline at card width; an interactive page runs in a sandboxed frame. A tap or the link opens either full size. */
  function rung(d) {
    if (!d.view) return '';
    const url = `/api/mock?key=${encodeURIComponent(d.key)}`, page = d.type === 'interactive';
    const open = { href: src(url), target: '_blank', rel: 'noopener' }, name = page ? 'interactive page' : 'diagram';
    let body;
    if (page) body = el('div', { class: 'frame' }, el('iframe', { src: src(url), title: `Interactive page: ${d.title}`, sandbox: 'allow-scripts', loading: 'lazy' }));
    else {
      const img = el('img', { src: src(url), alt: `Diagram: ${d.title}` });
      // The picture is a tap target too; keyboard and screen reader users get the one link below.
      body = el('a', { class: 'frame', ...open, tabindex: '-1' }, img);
      img.onerror = () => body.replaceWith(el('p', { class: 'gone' }, "The diagram can't be shown: its file is missing or in a format this browser can't draw."));
    }
    return el('div', { class: 'rung' }, body, el('a', { class: 'meta', ...open, 'aria-label': `Open the ${name} full size, ${d.title}` }, 'Open full size'));
  }

  /** One card per option: the mock preview (tap opens it full size), its label, the Recommended badge and its Pick button. */
  function mockCards(d, buttons) {
    return el('div', { class: 'mocks', role: 'group', 'aria-label': d.title }, ...d.options.map((o, i) => {
      const m = d.mocks?.find((x) => x.value === o.value);
      // A `page.html?variant=b` mock keeps its variant in the frame's query, where the page reads it.
      const [path, query] = m?.path.split('?') ?? [];
      const url = m && src(`/api/mock?key=${encodeURIComponent(d.key)}&value=${encodeURIComponent(m.value)}${query ? `&${query}` : ''}`);
      const view = m && (/\.html?$/i.test(path) ? el('iframe', { src: url, title: `Mock ${o.label}`, tabindex: '-1', 'aria-hidden': 'true', loading: 'lazy' })
        : el('img', { src: url, alt: `Mock: ${o.label}` }));
      return el('figure', { class: 'mock' },
        m ? el('a', { class: 'shot', href: url, target: '_blank', rel: 'noopener', 'aria-label': `Open mock ${o.label} full size` }, view) : '',
        el('figcaption', {}, el('span', { class: 'label', dir: 'auto' }, o.label),
          o.value === d.recommend_value ? el('span', { class: 'badge' }, 'Recommended') : '', buttons[i]));
    }));
  }

  /** The top of the page: how much waits, one-tap type filters with waiting counts, and the oldest waiting items to jump to. */
  function glance(all, filter, waiting) {
    const open = all.filter((d) => !Object.hasOwn(state.answers, d.key));
    const kinds = Object.keys(FILTERS).filter((k) => k === filter || all.some((d) => kind(d) === k));
    const filterBtn = (k, label, n) => {
      const b = el('button', { 'aria-pressed': k === filter, 'data-k': k, 'aria-label': `${label}, ${n} waiting` }, label, el('span', { class: 'n' }, String(n)));
      b.onclick = () => { if (k !== filter) { refocus = k; location.hash = k && `type=${k}`; } };
      return b;
    };
    const jump = (d) => {
      const b = el('button', { 'aria-label': `Go to ${title(d)}` }, chip(d), el('span', { dir: 'auto' }, title(d)));
      b.onclick = () => document.getElementById(`item-${d.key}`).scrollIntoView({ behavior: 'smooth' });
      return el('li', {}, b);
    };
    // The board file appends new items at the end, so its order is oldest first.
    const oldest = [...waiting].reverse(), SHOWN = 5;
    return el('section', { class: 'glance', 'aria-label': 'At a glance' },
      el('p', { class: 'big' }, open.length ? `${open.length} waiting on you` : 'Nothing is waiting on you'),
      kinds.length > 1 || filter ? el('div', { class: 'filters', role: 'group', 'aria-label': 'Show one type' }, filterBtn('', 'All', open.length),
        ...kinds.map((k) => filterBtn(k, FILTERS[k], open.filter((d) => kind(d) === k).length))) : '',
      ...(oldest.length ? [el('p', { class: 'meta' }, 'Waiting longest'), el('ol', { class: 'oldest' }, ...oldest.slice(0, SHOWN).map(jump))] : []),
      oldest.length > SHOWN ? el('p', { class: 'meta' }, `and ${oldest.length - SHOWN} more below`) : '');
  }

  let refocus = null; // The filter chip that was tapped, focused again after the page redraws.
  function render() {
    // The board file appends new items at the end, so reversed is newest first.
    const all = [...state.decisions].reverse();
    const pick = /^#type=([a-z]+)$/.exec(location.hash)?.[1];
    const filter = Object.hasOwn(FILTERS, pick ?? '') ? pick : '';
    const items = all.filter((d) => !filter || kind(d) === filter);
    const waiting = items.filter((d) => !Object.hasOwn(state.answers, d.key));
    const answered = items.filter((d) => Object.hasOwn(state.answers, d.key));
    const done = all.filter((d) => Object.hasOwn(state.answers, d.key)).length;
    document.getElementById('count').textContent = `${all.length - done} waiting · ${done} answered${FROZEN ? ` · read-only copy, ${FROZEN.exported}` : ''}`;
    const list = (items, cls) => el('div', { class: `list ${cls}` }, ...items.map(row));
    // The Ask box is for the live board; the frozen copy has no agent to read it.
    document.getElementById('board').replaceChildren(glance(all, filter, waiting), ...(FROZEN ? [] : [ask()]),
      el('h2', {}, 'Waiting'), waiting.length ? list(waiting, 'waiting')
        : el('p', { class: 'empty' }, filter ? `No ${filter === 'other' ? 'other items' : FILTERS[filter].toLowerCase()} waiting on you.` : 'Nothing is waiting on you.'),
      ...(answered.length ? [el('h2', {}, 'Answered'), list(answered, 'answered')] : []));
    if (refocus !== null) document.querySelector(`.filters [data-k="${refocus}"]`)?.focus();
    refocus = null;
    if (FROZEN) {
      // Answers stay as they are, but nothing in the copy can be sent.
      document.querySelectorAll('#board .choices button, #board .mock button, #board .note button, #board .note textarea').forEach((e) => (e.disabled = true));
      // A browser will not open a data: link in a new tab; the inline preview is the copy.
      document.querySelectorAll('#board a[href^="data:"]').forEach((a) => a.removeAttribute('href'));
    }
  }
  addEventListener('hashchange', render);

  const banner = document.getElementById('banner');
  if (FROZEN) (state = FROZEN), render();
  else call('/api/decisions').then(() => (banner.hidden = true), (e) => {
    banner.textContent = `Can't read the board file: ${e.message}`;
    banner.hidden = false;
  });
</script>
</body>
</html>
