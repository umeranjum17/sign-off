<style>
  /* Spacious, Apple grade. A phone reads white tiles on a grey grouped page; a desk reads grey tiles on a white page (the 64rem block swaps them).
     The board's own names below are all mapped onto tokens.css, where every raw value lives. --accent is the blue for text, links and focus; --action is the blue a button is filled with.
     Meaning colours are the token mixed toward black where they set text on a light ground, so they keep 4.5:1. */
  :root {
    --page: var(--tk-grouped); --tile: var(--tk-surface); --desk: var(--tk-canvas); --desk-tile: var(--tk-card); --bar: var(--tk-surface-high); --sunk: var(--tk-surface-selected); --line: var(--tk-rail);
    --text: var(--tk-text); --muted: var(--tk-text-secondary); --border: var(--tk-text-tertiary); --accent: color-mix(in srgb, var(--tk-link) 80%, #000); --action: color-mix(in srgb, var(--tk-link) 90%, #000); --on-accent: #FFFFFF; --danger: color-mix(in srgb, var(--tk-critical) 75%, #000); --bezel: var(--tk-text);
    --c-waiting: var(--action); --c-evidence: color-mix(in srgb, var(--tk-success) 55%, #000); --c-reports: color-mix(in srgb, var(--tk-warning) 62%, #000); --c-answered: var(--muted); --c-gate: #8A6100;
    --ok: var(--c-evidence); --warn: var(--c-reports); --badge: color-mix(in srgb, var(--tk-critical) 80%, #000); --faint: var(--tk-text-tertiary);
    --bg: var(--page); --surface: var(--tile); --seg-on: var(--tk-on); --teal: var(--tk-teal); --gutter: var(--tk-gutter); }
  /* One type scale (28/20/17/16/15/13/12, 32 and 22 on a desk), one 4px spacing grid, one control size per role: 44px for a main action and every tap target, 10px corners.
     The sizes of a title, body, secondary line and footnote, the card corner and the raised shadow come from tokens.css; the display sizes are the board's own. */
  :root { --t-xl: 1.75rem; --t-l: 1.25rem; --t-m: var(--tk-fs-title); --t-b: var(--tk-fs-body); --t-s: var(--tk-fs-secondary); --t-xs: var(--tk-fs-footnote); --t-xxs: 0.75rem; --r-ctl: var(--tk-r-ctl); --r-card: var(--tk-r-card); --ctl: 2.75rem; }
  @media (min-width: 64rem) { :root { --t-xl: 2rem; --t-l: 1.375rem; } }
  /* The approved feel's surfaces: Today's ground and raised cards, the glass tab bar and its pill, an iOS hairline, a second fill, and the lift of a card and of a capture. */
  :root { --ground: var(--tk-grouped); --card: var(--tk-surface); --side: var(--tk-canvas); --tabbar: var(--tk-card); --tab-on: var(--tk-on); --hairline: rgba(60, 60, 67, 0.29); --fill-2: rgba(118, 118, 128, 0.2);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.05); --shot-edge: 0 0 0 0.5px rgba(0, 0, 0, 0.14), 0 12px 32px rgba(0, 0, 0, 0.12); }
  @media (prefers-color-scheme: dark) { :root { --ground: var(--tk-canvas); --side: var(--tk-canvas); --tabbar: var(--tk-card); --tab-on: var(--tk-on); --hairline: rgba(255, 255, 255, 0.1); --fill-2: rgba(118, 118, 128, 0.34);
    --shadow-card: 0 0 0 0.5px rgba(255, 255, 255, 0.06); --shot-edge: 0 0 0 0.5px rgba(255, 255, 255, 0.16), 0 16px 40px rgba(0, 0, 0, 0.55); } }
  @media (prefers-color-scheme: dark) { :root {
    --page: var(--tk-grouped); --tile: var(--tk-surface); --desk: var(--tk-canvas); --desk-tile: var(--tk-card); --bar: var(--tk-surface-high); --sunk: var(--tk-input); --line: var(--tk-rail);
    --accent: var(--tk-link); --danger: var(--tk-critical); --bezel: var(--tk-rail);
    --c-waiting: var(--tk-link); --c-evidence: var(--tk-success); --c-reports: var(--tk-warning); --c-gate: #FFD60A; --badge: var(--tk-critical); --seg-on: var(--tk-on); } }
  * { box-sizing: border-box; }
  /* A phone keeps 140px at the bottom, so the last row scrolls fully clear of the floating tab bar. */
  /* A phone keeps the text size it was given on every screen, so the tab bar never grows or shrinks. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; padding-bottom: calc(8.75rem + env(safe-area-inset-bottom)); background: var(--bg); color: var(--text); overflow-wrap: anywhere;
    -webkit-font-smoothing: antialiased; font: var(--t-b)/1.5 var(--tk-font); letter-spacing: -0.011em; }
  /* The board areas each have a colour, used on icons, dots and marks. */
  .i-waiting { --area: var(--c-waiting); } .i-evidence { --area: var(--c-evidence); } .i-reports { --area: var(--c-reports); } .i-answered { --area: var(--c-answered); }
  main { max-width: 72rem; margin: 0 auto; padding: 0 max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left)); }
  .banner { margin: 1rem 0 0; padding: 0.75rem 1rem; border: 1px solid var(--danger); border-radius: 0.5rem; color: var(--danger); }
  /* The page's title row, as ui.css draws it: 8px from the top, a 24px medium title in a 44px row. */
  .top { position: relative; padding: 0.5rem 0 1rem; }
  /* A search field; what matches lists under it. */
  .search { margin: 0 0 1rem; }
  .search input { width: 100%; min-height: 2.75rem; padding: 0 0.875rem; border: 0; border-radius: 0.625rem; background: var(--sunk); color: var(--text); font: inherit; }
  .search .rows { margin-top: 0.75rem; }
  .top h1 { margin: 0; color: var(--tk-ink); font-size: var(--tk-fs-page); line-height: var(--tk-lh-page); font-weight: 500; letter-spacing: 0; outline: none; }
  .lede { margin: 0.5rem 0 0; color: var(--muted); }
  .back, .sec-head a, .more { display: inline-flex; align-items: center; min-height: 2.75rem; color: var(--accent); font-weight: 400; text-decoration: none; }
  h2 { font-size: 1.375rem; line-height: 1.25; margin: 0 0 0.75rem; }
  .icon { flex: none; display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; background: var(--area, var(--muted)); }
  .icon svg { width: 1.125rem; height: 1.125rem; fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* Today, as the approved feel draws it: the date over a large title and a ring that fills as asks are cleared, one Up next card with one main action,
     four tiles in two rows (each opens what it counts), the latest proof with a capture each, the new report, and what was cleared today, on a grey ground. */
  body.today { --bg: var(--ground); --surface: var(--card); }
  body.today main { padding: 0 max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left)); }
  .top.today-top { padding: 1.25rem 0 0; }
  .today-top .date-kicker { height: 1.25rem; margin: 0; line-height: 1.25rem; letter-spacing: 0.01em; }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.75rem; }
  body.today .today-top h1 { font-size: 2.125rem; line-height: 2.5625rem; letter-spacing: -0.026em; }
  .today-top .sub { margin: 2px 0 0; color: var(--muted); font-size: var(--t-s); line-height: 1.25rem; }
  /* Scrolled on a phone, the large title gives way to a small one in a glass bar at the top, as on iOS. */
  .cbar { position: fixed; z-index: 2; top: 0; left: 0; right: 0; display: grid; place-items: center; height: calc(3.25rem + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
    background: var(--tabbar); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); box-shadow: 0 0.5px 0 var(--hairline);
    font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.02em; opacity: 0; pointer-events: none; transition: opacity 160ms linear; }
  body.scrolled .cbar { opacity: 1; }
  .ring { position: relative; flex: none; width: 2.75rem; height: 2.75rem; margin-bottom: 2px; }
  .ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4.5; }
  .ring .bg { stroke: var(--fill-2); } .ring .fg { stroke: var(--tk-success); stroke-linecap: round; transition: stroke-dashoffset 600ms var(--spring); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--t-xs); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  /* Up next: the one ask that matters most, its kind in its colour, and one main action beside a quiet second one. */
  .up-next { position: relative; margin: 1.25rem 0 0; padding: 1.125rem; border-radius: 1.375rem; background: var(--card); box-shadow: var(--shadow-card); overflow: hidden; }
  .g-answer { --k: var(--action); } .up-next.clear { --k: var(--tk-success); }
  .up-next .lk { display: flex; align-items: center; gap: 0.5rem; margin: 0; color: var(--k); font-size: var(--t-xs); line-height: 1.125rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
  .up-next .lk .dot { flex: none; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--k); box-shadow: 0 0 0 4px color-mix(in srgb, var(--k) 18%, transparent); }
  .up-next .lk .when { margin-left: auto; color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .up-next .lk .when.hot { color: var(--warn); font-weight: 600; }
  .up-next h2 { margin: 0.625rem 0 0.375rem; font-size: 1.375rem; line-height: 1.75rem; letter-spacing: -0.022em; }
  .up-next p { margin: 0; color: var(--muted); font-size: var(--t-s); line-height: 1.3125rem; }
  .up-next .rec { display: flex; align-items: center; gap: 0.625rem; margin-top: 0.875rem; padding: 0.75rem 0.875rem; border-radius: 0.875rem; background: var(--sunk); color: var(--text); }
  .up-next .rec .glyph { width: 1.25rem; height: 1.25rem; color: var(--k); }
  .up-next .rec b { font-weight: 600; }
  .up-next .acts { display: flex; gap: 0.625rem; margin-top: 1rem; }
  .up-next .acts > * { display: flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 3.25rem; padding: 0 1.125rem; border-radius: 1rem; font-size: var(--t-m); font-weight: 600;
    letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; transition: transform 260ms var(--spring), filter 120ms linear; }
  .up-next .acts > :active { transform: scale(0.965); transition-duration: 90ms; }
  /* The main action names the pick, so a long one wraps inside the button rather than being cut. */
  .up-next .go { position: relative; overflow: hidden; flex: 1; min-width: 0; padding-block: 0.5rem; white-space: normal; text-align: center; line-height: 1.25rem; background: var(--action); color: #FFFFFF; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset, 0 6px 16px -6px color-mix(in srgb, var(--action) 70%, transparent); }
  .up-next .go:active { filter: brightness(0.92); }
  /* Answered from here, the button turns green and draws a check; then the next ask slides up into the card. */
  .up-next .go.done, .up-next .go.done:disabled { background: color-mix(in srgb, var(--tk-success) 82%, #000); color: #FFFFFF; } .up-next .go.done .kc { visibility: hidden; }
  .up-next.next > * { animation: lead-in 260ms var(--ease); }
  @keyframes lead-in { from { opacity: 0; transform: translateY(0.875rem); } }
  .up-next .soft { flex: none; background: var(--sunk); color: var(--text); }
  .up-next .go .kc { display: none; background: rgba(255, 255, 255, 0.22); color: #FFFFFF; box-shadow: none; }
  .up-next .strip { display: flex; gap: 0.5rem; margin-top: 0.875rem; }
  .up-next .strip img { width: 4.125rem; height: 8.9375rem; border-radius: 0.5rem; object-fit: cover; object-position: top; box-shadow: var(--shot-edge); }
  /* An optional comment under a pick, folded until asked for; what is typed goes with the answer. */
  .up-next .cmt { margin: 0.625rem -0.875rem 0; }
  .up-next .cmt > summary { display: flex; align-items: center; gap: 0.625rem; min-height: 3rem; padding: 0 0.875rem; border-radius: 0.875rem; color: var(--accent); font-weight: 500; list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .up-next .cmt > summary::-webkit-details-marker { display: none; }
  .up-next .cmt > summary:active { background: var(--sunk); }
  .up-next .cmt[open] > summary { color: var(--muted); }
  .up-next .cmt > summary .glyph { width: 1.25rem; height: 1.25rem; }
  .up-next .cmt > summary small { margin-left: auto; color: var(--faint); font-size: var(--t-xs); font-weight: 500; }
  .up-next .cmt textarea { display: block; width: calc(100% - 1.75rem); min-height: 4rem; margin: 0.25rem 0.875rem 0; padding: 0.75rem 0.875rem; border: 0; border-radius: 0.875rem; background: var(--sunk); color: var(--text); font: inherit; resize: none; }
  .up-next.clear { padding: 1.75rem 1.125rem 1.875rem; text-align: center; }
  .up-next.clear .big { display: grid !important; place-items: center; width: 4.5rem; height: 4.5rem; margin: 0 auto 1.125rem; border-radius: 50%; color: #FFFFFF; background: var(--tk-success);
    box-shadow: 0 10px 28px -8px color-mix(in srgb, var(--tk-success) 70%, transparent); animation: pop 520ms var(--spring); }
  .up-next.clear .big .glyph { width: 2.125rem; height: 2.125rem; stroke-width: 2.6; }
  .up-next.clear h2 { margin: 0 0 0.375rem; }
  /* Four tiles, two by two on a phone: a disc in the group's colour, the count large, the group and one line; a tile at zero greys and shakes when tapped. */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin: 0.75rem 0 0; }
  .card, .tile { background: var(--surface); border-radius: var(--r-card); }
  .card { padding: var(--tk-sp-4); }
  .tile { display: flex; flex-direction: column; justify-content: space-between; min-height: 5.75rem; padding: 0.75rem 0.875rem; border-radius: 1.125rem; background: var(--card); box-shadow: var(--shadow-card);
    color: var(--text); text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform 260ms var(--spring); }
  .tile:active { transform: scale(0.975); transition-duration: 90ms; }
  .tile .tt { display: flex; align-items: flex-start; justify-content: space-between; }
  .tile .icon { width: 2rem; height: 2rem; border-radius: 50%; background: var(--k); }
  .tile .icon svg { width: 1.125rem; height: 1.125rem; stroke: #FFFFFF; stroke-width: 2.2; }
  .tile .n { font-size: 1.75rem; line-height: 2rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .tile .name { font-size: var(--t-s); line-height: 1.125rem; font-weight: 600; }
  .tile .name small { display: block; margin-top: 1px; color: var(--muted); font-size: var(--t-xs); line-height: 1rem; font-weight: 500; }
  .tile.zero .n { color: var(--faint); } .tile.zero .icon { background: var(--fill-2); } .tile.zero .icon svg { stroke: var(--muted); }
  .tile.shake { animation: shake 360ms var(--ease); }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .tile:focus-visible { outline-offset: 2px; }
  .tile.g-answer { --k: var(--tk-link); } .tile.g-signin { --k: var(--tk-warning); } .g-proof { --k: var(--tk-success); } .g-proof.failed { --k: var(--tk-critical); }
  /* A tile opens Decide at its group, whose head flashes. */
  .dl-head { scroll-margin-top: 1rem; } .dl-head.flash { animation: head-flash 900ms var(--ease); }
  @keyframes head-flash { from, 40% { color: var(--accent); } }
  /* Section heads 32px under what comes before them, the link keeping a tall tap area without pushing the rows down. */
  .t-sec .sec-head { align-items: baseline; margin: 2rem 0.25rem 0.625rem; }
  .t-sec .sec-head h2 { margin: 0; font-size: 1.25rem; line-height: 1.5625rem; letter-spacing: -0.02em; }
  .t-sec .sec-head a { min-height: 2.75rem; margin: -0.75rem -0.5rem -0.75rem 0; padding: 0 0.5rem; font-size: var(--t-s); font-weight: 500; }
  /* A grouped list: a capture or a check, the title on one line, one quiet line under it, then a chevron. */
  .t-list { list-style: none; margin: 0; padding: 0; overflow: hidden; border-radius: 1.125rem; background: var(--card); box-shadow: var(--shadow-card); }
  .t-list li { position: relative; }
  .t-list li + li::before { content: ""; position: absolute; z-index: 1; top: 0; right: 0; left: 3.875rem; border-top: 0.5px solid var(--hairline); }
  .lrow { display: flex; align-items: center; gap: 0.75rem; min-height: 3.75rem; padding: 0.625rem 0.875rem; color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: background-color 120ms linear; }
  .lrow:active { background: color-mix(in srgb, var(--text) 6%, var(--card)); transition: none; }
  .lrow .lt { display: grid; flex: 1; min-width: 0; }
  .lrow .lt b { font-size: 1rem; line-height: 1.3125rem; font-weight: 600; letter-spacing: -0.02em; }
  .lrow .lt > span { color: var(--muted); font-size: 0.875rem; line-height: 1.1875rem; }
  .lrow .chev { flex: none; } .lrow .chev .glyph { width: 1.125rem; height: 1.125rem; color: var(--tk-rail); }
  .mini { flex: none; width: 2.25rem; height: 3rem; overflow: hidden; border-radius: 0.375rem; background: var(--sunk); box-shadow: var(--shot-edge); }
  .mini img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .mini .icon { width: 100%; height: 100%; border-radius: 0; background: none; } .mini .icon svg { stroke: var(--muted); }
  .res { display: inline-flex; align-items: center; gap: 0.3125rem; font-weight: 600; }
  .res::before { content: ""; width: 0.4375rem; height: 0.4375rem; border-radius: 50%; background: currentColor; }
  .res.ok { color: var(--ok); } .res.bad { color: var(--danger); } .res.warn { color: var(--warn); } .res.none::before { display: none; }
  .donek { display: grid; flex: none; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: color-mix(in srgb, var(--tk-success) 16%, transparent); color: var(--tk-success); }
  .donek .glyph { width: 1.125rem; height: 1.125rem; stroke-width: 2.6; }
  /* Proof that kept only text has its result's mark where a capture would be, never an empty frame. */
  .donek.bad { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); } .donek:is(.warn, .none) { background: var(--sunk); color: var(--muted); }
  /* The new report: its picture (teal, as on Reports), what it explains with, its title, two lines of what it says, and who filed it when. */
  .rp-card { display: flex; align-items: flex-start; gap: 0.875rem; padding: 1rem; border-radius: 1.125rem; background: var(--card); box-shadow: var(--shadow-card); color: inherit; text-decoration: none;
    -webkit-tap-highlight-color: transparent; transition: transform 260ms var(--spring); }
  .rp-card:active { transform: scale(0.975); transition-duration: 90ms; }
  .rp-card .rth { display: grid; flex: none; place-items: center; width: 4.5rem; height: 4.5rem; border-radius: 1.125rem; color: var(--teal);
    background: color-mix(in srgb, var(--teal) 13%, var(--card)); box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--teal) 30%, transparent); }
  .rp-card .rth svg { width: 3.25rem; height: 3.25rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .rp-card .t { display: block; flex: 1; min-width: 0; }
  .rp-card .ey { display: block; color: var(--teal); font-size: var(--t-xs); line-height: 1.125rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
  .rp-card .h { display: block; margin: 0.25rem 0; font-size: 1.125rem; line-height: 1.4375rem; font-weight: 700; letter-spacing: -0.02em; }
  .rp-card .p { display: -webkit-box; overflow: hidden; color: var(--muted); font-size: var(--t-s); line-height: 1.25rem; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .rp-card .m { display: block; margin-top: 0.5rem; color: var(--faint); font-size: var(--t-xs); font-weight: 500; }
  /* Under all that, the tools the approved feel has no place for: search, the way to everything answered, the Leash and Ask the agent. */
  .t-foot { margin-top: 2rem; }
  .t-foot > .search { margin: 0; } .t-foot > .more, .t-foot > .ask > summary { padding: 0 0.25rem; }
  .t-foot .leash-h { margin: 2rem 0.25rem 0.625rem; } .t-foot .leash-h h2 { margin: 0; font-size: 1.25rem; line-height: 1.5625rem; letter-spacing: -0.02em; }
  /* The Leash: one control for how much agents may do without asking, and what the chosen one means below it. */
  .leash { display: flex; flex-direction: column; gap: var(--tk-sp-3); padding: 0.875rem 1rem 1rem; border-radius: var(--r-card); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--sunk); border-radius: 0.5625rem; padding: 2px; }
  .seg button { min-height: var(--ctl); border: 0; border-radius: 0.4375rem; background: none; color: var(--text); font: inherit; font-size: var(--t-xs); line-height: 1.2; padding: 0.25rem 0.375rem; }
  .seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: var(--tk-elev-raised); color: var(--text); font-weight: var(--tk-fw-semibold); }
  .seg button[aria-pressed="true"]::before { content: none; }
    .leash-line { margin: 0.5rem 1rem 0; color: var(--muted); font-size: var(--t-xs); line-height: 1.1875rem; letter-spacing: -0.01em; }
  @media (max-width: 63.999rem) {
    /* The smaller Decide title lifts a short ask; the page still reaches the bar so a swipe anywhere above it skips. */
    .decide { min-height: calc(100dvh - 13.5rem - env(safe-area-inset-bottom)); }

<script>
  let state = { decisions: [], answers: {} };
  // An exported copy carries its state and files inline and is read-only.
  const FROZEN = window.FROZEN, src = (url) => FROZEN?.files[url] ?? url;
  // Typed notes not yet sent, kept across re-renders and reloads in this browser, per board file.
  const drafts = new Map(), stored = () => `sign-off-drafts ${state.file}`;
  const keep = () => { try { localStorage.setItem(stored(), JSON.stringify([...drafts])); } catch {} };
  let loaded = false;
  // Text goes in as text nodes, never as HTML, so a title from the file can't run code.
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);

  // Motion and touch: reduced motion makes every wait instant; a haptic tick (Android only) marks a swipe's commit line, a saved answer and an Undo.
  const calm = matchMedia('(prefers-reduced-motion: reduce)');

  /** sent runs only once the server saved the request, so a draft is dropped only then; the redraw waits for it (an answer's check plays out before the list comes back). */
  async function call(path, init, sent) {
    const res = await fetch(path, init);
    const body = await res.json().catch(() => ({ error: `The server replied ${res.status}` }));
    if (!res.ok) throw Object.assign(new Error(body.error), { status: res.status });
    state = body;
    if (!loaded) {
      loaded = true;
      try { for (const [k, v] of JSON.parse(localStorage.getItem(stored())) ?? []) drafts.set(k, v); } catch {}
    }
    await sent?.();
    render();
  }

  const clearIfSaved = (key, sent) => () => { if (drafts.get(key) === sent) drafts.delete(key); keep(); };

  function lock(...btns) {
    const controls = [...btns, ...(btns[0].closest('.decide, .row')?.querySelectorAll('button') ?? [])].filter((b) => !b.disabled);
    controls.forEach((b) => (b.disabled = true));
    return () => controls.forEach((b) => (b.disabled = false));

  // `words` names the draft the note is read from: the card's box, or Decide's Your own answer, which it keeps apart from the note.

      }, async () => { forget(d.key); unfolded.delete(d.key); if (!typed) drop(); await land?.(); });

      // From one ask to another the page pushes on going forward and pops on going back, in the order the arrows step.
      const order = (h) => walkKeys.indexOf(h.slice(8));
      slide(ask.test(location.hash) && from === '#waiting' ? 'push' : ask.test(from) && location.hash === '#waiting' ? 'pop' : ask.test(from) && ask.test(location.hash) ? (order(location.hash) < order(from) ? 'pop' : 'push') : '');
    }
    if (!reader.hidden) { scrollTo(0, 0); return reader.querySelector('h1').focus({ preventScroll: true }); }
    const item = (jump || back) && document.getElementById(`item-${jump || back}`);
    jump = null;
    item ? item.scrollIntoView() : scrollTo(0, 0);
    titleBar();
    // Search, in the dock or the sidebar, opens Today with its search box in hand.
    if (location.hash === '#find') return findBox();
    // A Today tile opens Decide at its group, whose head flashes.
    const group = toGroup && location.hash === '#waiting' && [...document.querySelectorAll('.dl-head')].find((h) => h.firstChild.textContent === GROUPS.find(([g]) => g === toGroup)?.[1]);
    toGroup = '';
    if (group) { group.scrollIntoView({ block: 'start' }); group.classList.add('flash'); }
    // A Decide row is itself the link back to its page.
    // On a desk the focus stays on the selected row, so J, K and Enter carry on from it.
    ((back && (item?.matches('a.dl-face') ? item : item?.querySelector('h3 a, .open-link, a.compact'))) || document.querySelector('.split-list [data-row][aria-current]') || document.querySelector('#board h1')).focus({ preventScroll: true });
  });
  const findBox = () => { const box = document.getElementById('find'); box?.scrollIntoView({ block: 'center' }); box?.focus({ preventScroll: true }); };
  addEventListener('click', (e) => { if (e.target.closest?.('a[href="#find"]') && location.hash === '#find') e.preventDefault(), findBox(); });
  // An interactive page may post its own height, `{ height: <px> }`, and its frame then fits it with no blank below.
  // Only a frame's own message sizes it. Document readers must fit even long pages; previews stay capped.
  addEventListener('message', (e) => {
    const frame = [...document.querySelectorAll('.rung iframe, iframe.plan-view, :is(#reader, .split-detail) .read iframe, .gd-dgbox:not(.full) iframe')].find((f) => f.contentWindow === e.source), h = e.data?.height;
    const documentFrame = frame?.matches('iframe.plan-view, :is(#reader, .split-detail) .read iframe, .gd-dgbox iframe');
    if (documentFrame && e.data?.['sign-off'] === 'ready') {
      frame.scrolling = 'no';
      frame.contentWindow.postMessage({ 'sign-off': 'size' }, '*');
    }
    if (frame && Number.isFinite(h) && h > 0) frame.style.height = `${Math.ceil(documentFrame ? h : Math.min(h, 10_000))}px`;
  });
  // A design mock page may point (web/point.js): the board keeps the last element named per mock, and turns pointing on for one mock frame.
  const pointing = new Map(), pointed = new Map();
  const mockFrame = (source) => [...document.querySelectorAll('.mock iframe')].find((f) => f.contentWindow === source);
  const aim = (frame) => {
    const on = talks() && pointing.get(frame.dataset.mock) === true;
    frame.style.pointerEvents = on ? 'auto' : '';
    frame.parentElement.classList.toggle('aiming', on);
    frame.contentWindow.postMessage({ 'sign-off': 'point', on }, '*');
  };
  function point(frame, on) {
    pointing.set(frame.dataset.mock, on);
    aim(frame);
  }
  // While pointing is on, a tap never opens the mock full size, even one that reaches the board instead of the frame:
  // one on the frame's edge, one the browser sends there until it has drawn the frame taking taps, or one before a frame drawn anew is ready.
  addEventListener('click', (e) => {
    const frame = e.target.closest?.('.shot')?.querySelector('iframe[data-mock]');
    if (frame && talks() && pointing.get(frame.dataset.mock) === true) e.preventDefault();
  });
  addEventListener('message', (e) => {
    const frame = mockFrame(e.source), msg = e.data;
    if (!frame || !msg) return;
    if (msg['sign-off'] === 'ready') aim(frame);
    if (msg['sign-off'] !== 'pointed' || !['ref', 'tag', 'text'].every((k) => typeof msg[k] === 'string')) return;
    pointed.set(frame.dataset.mock, { ref: msg.ref, tag: msg.tag, text: msg.text });
    // The element named opens the comment editor on its card, with its saved comment when it has one.
    const dm = frame.dataset.mock, cut = dm.indexOf('~'), d = state.decisions.find((x) => x.key === dm.slice(0, cut));
    if (!d || !talks() || pointing.get(dm) !== true) return;
    const mock = dm.slice(cut + 1);
    editing.set(d.key, { mock, hash: d.mocks?.find((m) => m.value === mock)?.hash, ref: msg.ref, tag: msg.tag, words: msg.text });
    redraw(d);
    document.getElementById(`ann-text-${d.key}`)?.focus();
  });

  const banner = document.getElementById('banner');
  const failed = (e) => {
    banner.textContent = `Can't read the board file: ${e.message}`;
    banner.hidden = false;
  };
  // Another program can change the board file (a feed, a new sign-in, signin done), so the page checks it every 20 seconds and redraws only on a change.
  async function refresh() {
    try {
      const res = await fetch('/api/decisions'), body = await res.json().catch(() => ({ error: `The server replied ${res.status}` }));
      if (!res.ok) throw new Error(body.error);
      banner.hidden = true;
      if (JSON.stringify(body) === JSON.stringify(state)) return;
      // A redraw keeps the reply box or search being typed in focused, with its caret where it was.
      const typing = (document.activeElement?.tagName === 'TEXTAREA' || document.activeElement?.id === 'find') && document.activeElement, at = typing && typing.selectionStart;
      state = body;
      render();
      const box = typing && document.getElementById(typing.id);
      if (box) box.focus(), box.setSelectionRange(at, at);
    } catch (e) { failed(e); }
  }
  if (FROZEN) (state = FROZEN), render();
  else call('/api/decisions').then(() => {
    banner.hidden = true;
    setInterval(refresh, 20_000);
  }, failed);
</script>
</body>
</html>
