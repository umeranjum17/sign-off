<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · sign-off</title>
<style>
  :root { color-scheme: light dark;
    --bg: #F6F3EE; --surface: #FFFFFF; --sunk: #EFEBE4; --line: #E6E0D6; --text: #1F1B16; --muted: #6A6157;
    --border: #B8AE9F; --accent: #C2410C; --on-accent: #FFFFFF; --danger: #B42318; --bezel: #1F1B16;
    --c-waiting: #E8590C; --c-evidence: #0C8599; --c-reports: #5B5BD6; --c-answered: #2B8A3E; --c-gate: #E8A100; --ok: #1E7034; --warn: #8A5A00;
    --shadow: 0 1px 2px rgb(60 40 20 / 0.06), 0 6px 18px rgb(60 40 20 / 0.06); }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #15120F; --surface: #211D18; --sunk: #1B1814; --line: #342E26; --text: #F3EEE6; --muted: #A99F91;
    --border: #6E6458; --accent: #FB923C; --on-accent: #1A1009; --danger: #FF8A80; --bezel: #4A4238;
    --c-waiting: #FF8A4C; --c-evidence: #3BC9DB; --c-reports: #9491FF; --c-answered: #51CF66; --c-gate: #FCC419; --ok: #51CF66; --warn: #FCC419;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.25); } }
  * { box-sizing: border-box; }
  body { margin: 0 0 3rem; background: var(--bg); color: var(--text); overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
    font: 1rem/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* The four areas each have a colour, used on icons, dots and marks. */
  .i-waiting { --area: var(--c-waiting); } .i-evidence { --area: var(--c-evidence); } .i-reports { --area: var(--c-reports); } .i-answered { --area: var(--c-answered); }
  main { max-width: 72rem; margin: 0 auto; padding: 0 1rem; }
  .side { display: none; }
  .banner { margin: 1rem 0 0; padding: 0.75rem 1rem; border: 1px solid var(--danger); border-radius: 0.5rem; color: var(--danger); }
  .top { position: relative; padding: 1rem 0 0.75rem; }
  /* The person who answers: a round mark beside the Summary title. The board has no name to show, so it is a plain figure. */
  .top > .i-you { position: absolute; top: 2.4rem; right: 0; width: 2.5rem; height: 2.5rem; border-radius: 50%; --area: var(--accent); }
  .top > .i-you svg { width: 1.375rem; height: 1.375rem; }
  .date { margin: 0; color: var(--muted); font-size: 0.9375rem; font-weight: 600; }
  .top h1 { margin: 0; font-size: 2.125rem; line-height: 1.2; letter-spacing: -0.01em; outline: none; }
  .lede { margin: 0.375rem 0 0; color: var(--muted); }
  .back, .sec-head a, .more { display: inline-flex; align-items: center; min-height: 2.75rem; color: var(--accent); font-weight: 600; text-decoration: none; }
  h2 { font-size: 1.375rem; line-height: 1.25; margin: 0 0 0.75rem; }
  .icon { flex: none; display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; background: var(--area, var(--muted)); }
  .icon svg { width: 1.125rem; height: 1.125rem; fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* Summary: a tile per area (each opens its screen), what needs you first, the day so far, then a short list per area. */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .card, .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; box-shadow: var(--shadow); }
  .card { padding: 1rem; }
  .tile { position: relative; display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-content: start; gap: 0.25rem 0.5rem; padding: 0.625rem 0.875rem; color: var(--text); text-decoration: none; }
  .tile::after { content: "›" / ""; position: absolute; top: 0.5rem; right: 0.875rem; color: var(--muted); font-size: 1.5rem; line-height: 1.2; }
  .tile .name { grid-column: 1 / -1; font-size: 0.875rem; font-weight: 600; color: var(--muted); line-height: 1.3; }
  .tile .detail { grid-column: 1 / -1; }
  .tile .n { grid-column: 1 / 3; font-size: 2.125rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tile .detail { font-size: 0.8125rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  /* The marks give way to the count: one line at the right, and a mark with no room left wraps out of sight. */
  .vis { align-self: center; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 0.25rem; height: 2.25rem; overflow: hidden; }
  .vis::before { content: ""; height: 100%; }
  .vis img { width: 1.5rem; height: 2.25rem; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 0.25rem; }
  .mark { width: 0.875rem; height: 0.875rem; border-radius: 50%; border: 2px solid var(--area); }
  /* Waiting shows one clock and Answered up to three checks, drawn in the area's colour. */
  .vis .icon { width: auto; height: auto; background: none; } .vis .icon svg { width: 1.5rem; height: 1.5rem; stroke: var(--area); }
  .i-waiting .vis .icon svg { width: 2.25rem; height: 2.25rem; }
  .i-reports .mark { width: 0.375rem; height: 1.25rem; border-radius: 2px; background: var(--area); }
  .pair, .areas { display: grid; gap: 1rem; margin-top: 1rem; }
  /* What needs you first and the ask in Triage: its pictures side by side and its answers stacked at one width. */
  .needs .row, .focus .row { padding: 0; border: 0; background: none; box-shadow: none; grid-template-columns: minmax(0, 1fr); }
  .needs .row .choices, .focus .row .choices { display: grid; grid-template-columns: minmax(0, 1fr); }
  .needs .row .choices, .needs .rung { max-width: 28rem; }
  .needs .media, .focus .media { flex-wrap: nowrap; }
  .needs .media > *, .focus .media > * { flex: 1 1 0; min-width: 0; }
  .needs .mocks, .focus .mocks { grid-auto-columns: minmax(0, 1fr); max-width: 16rem; margin: 0; }
  .focus .mocks { max-width: 24rem; }
  .focus .shot { aspect-ratio: 3 / 4; }
  .needs .shot { aspect-ratio: 1; }
  /* Triage: the open asks one at a time, the question big and the answers big enough for a thumb; at desktop the queue sits beside it. */
  .fhead { margin: 0; color: var(--muted); font-size: 0.875rem; font-weight: 650; }
  .pbar { height: 4px; margin: 0.5rem 0 1rem; border-radius: 4px; background: var(--line); overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--c-waiting); }
  .focus .since { margin: -0.375rem 0 1rem; font-weight: 600; } .needs > .since { margin: -0.25rem 0 0.5rem; font-weight: 600; }
  .focus .row h3 { font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.01em; }
  .focus .choices button, .needs .choices .rec { min-height: 4rem; border-radius: 1rem; font-size: 1.125rem; font-weight: 600; }
  /* On Summary the recommended answer is the large button, and the others are pills under it. */
  .needs .choices button { font-weight: 600; } .needs .choices button:not(.rec) { justify-self: start; border-radius: 999px; }
  .needs .choices button[aria-pressed="true"] { padding-right: 2.75rem; }
  .quiet { display: flex; gap: 0.25rem; margin-top: 0.5rem; }
  .quiet button { border: 0; background: none; color: var(--muted); font-weight: 600; }
  .upnext { display: grid; margin-top: 1rem; }
  .upnext .meta { margin: 0; font-weight: 700; }
  .hint { text-align: center; }
  .queue, .keys { display: none; }
  .caught { text-align: center; }
  /* Reports: a card per report, its steps as numbered nodes on a line with only the marks that matter under each; Open lists them in place. */
  .reports { display: grid; gap: 0.75rem; }
  .report { display: grid; gap: 0.75rem; scroll-margin-top: 4.5rem; }
  .report .about, .report .decided { margin: 0; }
  .st { display: inline-flex; flex: none; align-items: center; gap: 0.375rem; padding: 0.125rem 0.625rem; border-radius: 999px; background: var(--sunk);
    font-size: 0.8125rem; font-weight: 650; white-space: nowrap; }
  .st::before { content: ""; width: 0.4375rem; height: 0.4375rem; border-radius: 50%; background: currentColor; }
  .st.ok { color: var(--ok); } .st.new { color: var(--c-reports); } .st.bad { color: var(--danger); } .st.warn { color: var(--warn); }
  .decided .lbl { display: block; color: var(--muted); font-size: 0.8125rem; font-weight: 650; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; margin: 1.5rem 0 0.75rem; }
  .sec-h h2, .sec-h .meta { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; margin: 0 0 0.75rem; padding: 0.625rem 1rem; color: var(--muted); font-size: 0.875rem; }
  .legend > span, .marks { display: inline-flex; align-items: center; gap: 0.375rem; }
  /* At phone width the four marks fit on one row. */
  @media (max-width: 30rem) { .legend { justify-content: space-between; gap: 0.25rem 0.5rem; padding: 0.625rem 0.75rem; } .legend > span { gap: 0.3125rem; } }
  .marks { flex-wrap: wrap; justify-content: center; gap: 0.25rem; }
  /* A mark is its shape; in the legend and the open steps list it sits in a small rounded badge. */
  .mk { display: inline-grid; place-items: center; }
  .mk::before { content: ""; width: 0.5rem; height: 0.5rem; background: var(--c); }
  .mk-ai { --c: var(--c-reports); } .mk-ai::before { border-radius: 50%; }
  .mk-store { --c: var(--c-evidence); } .mk-store::before { border-radius: 1px; }
  .mk-gate { --c: var(--c-gate); } .mk-gate::before { transform: rotate(45deg) scale(0.85); }
  .mk-fail { --c: var(--danger); } .mk-fail::before { width: 0.75rem; height: 0.3125rem; border-radius: 2px; }
  .legend .mk, .steps .mk { width: 1.375rem; height: 1.375rem; border: 1px solid var(--border); border-radius: 0.4375rem; background: var(--sunk); }
  .flow, .steps { display: grid; margin: 0; padding: 0; list-style: none; }
  .flow { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .flow li { position: relative; display: grid; justify-items: center; align-content: start; gap: 0.375rem; }
  .flow li + li::before { content: ""; position: absolute; top: 0.8125rem; right: 50%; width: 100%; border-top: 2px solid var(--line); }
  .num { position: relative; z-index: 1; display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border: 2px solid var(--muted); border-radius: 50%;
    background: var(--surface); font-size: 0.8125rem; font-weight: 700; }
  .steps { gap: 0.75rem; }
  .steps .mk { width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; }
  .steps .mk::before { width: 0.75rem; height: 0.75rem; }
  .steps .mk-fail::before { width: 0.9375rem; height: 0.375rem; }
  .steps li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.75rem; font-weight: 600; }
  .report .row { padding: 0; border: 0; background: none; box-shadow: none; }
  .report .rung > .meta { display: none; }
  .report .shot { aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 0.625rem; box-shadow: none; }
  .report .thumb { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 0.625rem; object-fit: contain; background: var(--sunk); }
  /* A report's card is one big tap target, its picture first: the title's link covers the card; only the × sits above it. */
  .report.page { position: relative; }
  .report.page h3 a { color: inherit; text-decoration: none; }
  .report.page h3 a::after { content: ""; position: absolute; z-index: 1; inset: 0; border-radius: inherit; }
  .report.page .x { position: relative; z-index: 2; }
  .report.page:has(h3 a:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
  .report.page:hover { border-color: var(--c-reports); }
  .report .go { color: var(--accent); font-weight: 650; }
  /* A report opens over the whole board, on a phone and a desk alike: a bar with the way back, then its page. */
  #reader { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; background: var(--bg); }
  #reader[hidden] { display: none; }
  #reader header { display: flex; align-items: center; gap: 0.5rem; min-height: 3.5rem; padding: 0.25rem 1rem; border-bottom: 1px solid var(--line); background: var(--surface); }
  #reader .close { display: inline-flex; flex: none; align-items: center; min-height: 3rem; margin-left: -0.5rem; padding: 0 0.5rem; border-radius: 0.625rem; color: var(--accent); font-weight: 650; text-decoration: none; }
  #reader h1 { margin: 0; min-width: 0; overflow: hidden; font-size: 1rem; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  #reader iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  body.reading { overflow: hidden; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
  .foot .meta { margin: 0 auto 0 0; }
  .foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .foot button { border-color: transparent; border-radius: 999px; background: var(--sunk); font-weight: 600; }
  /* Tall enough for the tallest column, six dots under its count, so no count reaches the caption above. */
  .day { position: relative; height: 6.5rem; border-bottom: 1px solid var(--border); }
  .col { position: absolute; bottom: 0.25rem; display: flex; flex-direction: column-reverse; align-items: center; gap: 0.1875rem; transform: translateX(-50%);
    font-size: 0.8125rem; font-weight: 700; line-height: 1.2; overflow-wrap: normal; }
  .dot { width: 0.625rem; height: 0.625rem; border-radius: 50%; background: var(--c-answered); }
  .hours { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  .events { list-style: none; margin: 0.75rem 0 0; padding: 0; display: grid; gap: 0.25rem; font-size: 0.9375rem; }
  .events time, .sec-head .meta { font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 0.5rem; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .sec-head h2 { margin: 0; overflow-wrap: normal; } /* A long count beside a section name wraps itself, never the name mid-word. */ .sec-head:has(+ .in-evidence) { margin: 1rem 0 0.375rem; }
  .rows { list-style: none; margin: 0; padding: 0 1rem; }
  .rows > li + li { border-top: 1px solid var(--line); }
  .compact { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; color: var(--text); text-decoration: none; }
  .compact .t { display: grid; flex: 1; min-width: 0; }
  /* The answer sits under the title, never beside it: a long answer beside the title squeezed it to a letter a line. */
  .ans { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; margin-top: 0.125rem; } .ans b { color: var(--c-answered); } .ans time { color: var(--muted); font-size: 0.875rem; }
  .compact strong { font-size: 1.0625rem; font-weight: 600; line-height: 1.3; }
  .compact .meta { margin: 0.125rem 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .thumb, .compact .icon { width: 3.5rem; height: 3.5rem; border-radius: 0.625rem; }
  .compact .icon { background: color-mix(in srgb, var(--area) 14%, var(--surface)); }
  .compact .icon svg { stroke: var(--area); }
  /* An answered row with no picture leads with a small check badge, so the row stays short. */
  .compact .icon.i-answered { width: 1.75rem; height: 1.75rem; border-radius: 0.5625rem; } .compact .icon.i-answered svg { width: 1rem; height: 1rem; }
  .done .thumb { width: 3rem; height: 3rem; border-radius: 0.75rem; }
  .thumb { flex: none; object-fit: cover; object-position: top; border: 1px solid var(--line); background: var(--sunk); }
  .list { display: grid; gap: 0.75rem; }
  /* A read-only board is for reading: its pages get most of the screen. */
  .readonly .rung iframe { height: 80vh; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.875rem; padding: 1rem; scroll-margin-top: 4.5rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 0.875rem; box-shadow: var(--shadow); }
  /* Waiting cards carry the accent stripe and the shadow; answered ones sit flat and quiet. */
  .in-waiting .row { box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
  .in-answered .row { background: transparent; box-shadow: none; }
  .in-answered .row h3 { color: var(--muted); font-weight: 500; }
  /* A sign-in: one big Open for its link, off once the link expired. */
  .open-link { display: grid; place-items: center; min-height: 3.5rem; border-radius: 1rem; background: var(--accent); color: var(--on-accent);
    font-size: 1.125rem; font-weight: 700; text-decoration: none; }
  button.open-link:disabled { border: 1px solid var(--line); background: var(--sunk); color: var(--muted); cursor: not-allowed; }
  .signin .line { margin: 0.375rem 0 0; } .signin .expiry { margin: 0.5rem 0 0; font-weight: 700; } .signin .expiry.gone { color: var(--danger); }
  .row h3, .report h3 { font-size: 1.1875rem; font-weight: 650; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }
  .about, details p { margin: 0.375rem 0 0; max-width: 70ch; }
  details p { color: var(--muted); }
  .about { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row:has(details:not(.note, .other, .tech)[open]) .about { display: none; }
  .about.full { display: block; }
  summary { cursor: pointer; color: var(--accent); font-size: 0.875rem; margin-top: 0.25rem; width: fit-content; }
  .meta { color: var(--muted); font-size: 0.8125rem; margin: 0.5rem 0 0; }
  /* Every card reads top down in one order: a short status line, the result as its headline, what changed, the proof, then the one decision.
     The headline keeps the card's whole width: the dismiss x floats at the corner, never in a row that squeezes the title. */
  .lead > .x { float: right; margin: -0.625rem -0.625rem -0.75rem 0.5rem; }
  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.625rem; margin: 0 0 0.375rem; color: var(--muted); font-size: 0.8125rem; font-weight: 600; }
  .ask-line { grid-column: 1 / -1; margin: 0 0 -0.375rem; font-weight: 650; }
  .why { grid-column: 1 / -1; margin: 0; color: var(--warn); font-size: 0.875rem; font-weight: 600; }
  .tech { grid-column: 1 / -1; font-size: 0.8125rem; } .tech summary { margin: 0; color: var(--muted); font-size: inherit; } .tech p { margin: 0.25rem 0 0; }
  /* Each capture keeps its own shape: the frame is the shot, bounded in height, never letterboxed; two or more share the row. */
  .media { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .75rem; }
  .media a { display: block; max-width: 100%; color: var(--accent); cursor: zoom-in; }
  .media img, .media video { display: block; width: auto; height: auto; max-width: 100%; max-height: min(24rem, 60vh);
    border: 1px solid var(--line); border-radius: .625rem; background: var(--sunk); }
  .media .gone { color: var(--danger); margin: 0; }
  .proof { grid-column: 1 / -1; } .proof:has(> :nth-child(2)) { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); max-width: 26rem; }
  /* An explainer's chapters: one tap jumps the video to that part and plays it. */
  .chapters { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.375rem; margin: -0.25rem 0 0; padding: 0; list-style: none; }
  .chapters button { min-height: 2.5rem; padding: 0 0.75rem; border-radius: 999px; border-color: var(--line); font-size: 0.875rem; }
  .chapters .at { margin-right: 0.375rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta a { color: var(--accent); }
  .err:empty { display: none; }
  .err:not(:empty) { color: var(--danger); font-size: 0.875rem; margin-top: 0.5rem; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  /* The quick answers come first and are big enough for a thumb; typing is last, behind Other answer. */
  /* Every card's answers read from the left, with the Recommended label above the answer and a picked answer's check on the right. */
  .choices button { position: relative; display: grid; justify-items: start; align-content: center; min-height: 3rem; padding: 0.625rem 1.25rem; text-align: left; }
  .choices .tag { order: -1; margin: 0 0 0.125rem; font-size: 0.875rem; letter-spacing: 0; text-transform: none; }
  .choices button[aria-pressed="true"]::before { position: absolute; right: 1rem; top: 50%; translate: 0 -50%; margin: 0; }
  .row > .note, .row > .err { grid-column: 1 / -1; }
  /* Other answer is a plain row with a chevron. */
  .other > summary { display: flex; align-items: center; min-height: 2.75rem; margin: 0; padding: 0 0.25rem 0 0; list-style: none; color: var(--text); font-size: 0.9375rem; font-weight: 600; }
  .other > summary::-webkit-details-marker { display: none; }
  .other:not([open]) > :not(summary), .done:not([open]) > :not(summary) { display: none; }
  .other > summary::after { content: ""; width: 0.4375rem; height: 0.4375rem; margin: -0.25rem 0 0 0.75rem; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .other[open] > summary::after { margin-top: 0.25rem; transform: rotate(-135deg); }
  .actions .quick { border-radius: 999px; }
  /* After a tap: what was saved, and an Undo for a few seconds. */
  #toast { position: fixed; z-index: 3; left: 1rem; right: 1rem; bottom: max(1rem, env(safe-area-inset-bottom)); max-width: 30rem; margin: 0 auto;
    display: flex; align-items: center; gap: 0.75rem; padding: 0.375rem 0.375rem 0.375rem 1rem; border-radius: 0.75rem;
    background: var(--text); color: var(--bg); box-shadow: var(--shadow); }
  #toast[hidden] { display: none; }
  #toast span { flex: 1; min-width: 0; }
  #toast button { flex: none; background: transparent; color: inherit; border-color: currentColor; font-weight: 600; }
  #toast button:focus-visible { outline-color: var(--bg); }
  button { min-height: 2.75rem; padding: 0 1.25rem; border-radius: 0.5rem; border: 1px solid var(--border); cursor: pointer;
    background: var(--surface); color: var(--text); font: inherit; font-weight: 500; }
  /* Recommended is a dashed accent outline and a tag; picked is filled with a check. They never look alike. */
  button.rec { border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .tag::before { content: "★ " / ""; }
  .tag { display: inline-block; white-space: nowrap; margin-left: 0.375rem; color: var(--accent); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

  .choices.many { display: flex; flex-wrap: wrap; }
  /* An ask that says what each answer does: one answer per line on a phone, its outcome and the reason for the recommended one under its label. */
  .choices.told { grid-template-columns: minmax(0, 1fr); }

  .choices.many button { flex: 1 1 auto; max-width: 100%; padding: 0.5rem 1rem; }
  .note label { display: block; color: var(--muted); font-size: 0.8125rem; margin-top: 0.5rem; }
  .tradeoff { margin: 0; max-width: 70ch; }
  /* Dismiss: a quiet round x at the corner of a card or the end of a row. */
  .x { flex: none; display: grid; place-items: center; width: 2.75rem; padding: 0; margin: -0.5rem 0 -0.5rem auto; border: 0; border-radius: 50%;
    background: none; color: var(--muted); font-size: 1.5rem; line-height: 1.25; }
  .x:hover { background: var(--sunk); color: var(--text); }
  .rows > li { display: flex; align-items: center; }
  .rows li .compact { flex: 1; min-width: 0; }
  .rows li .x { margin: 0; }
  .clear { min-height: 2.75rem; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 600; }
  /* An answered row opens to its full card, without the title it already shows. */

  .done summary::-webkit-details-marker { display: none; }
  .done > .row { padding: 0 0 1rem; border: 0; background: none; box-shadow: none; }
  .done > .row .eyebrow, .done > .row h3 { display: none; }
  .done[open] + .x { align-self: start; margin-top: 1rem; }
  .needs .foot { justify-content: space-between; margin-top: 1rem; padding-top: 0.5rem; border-top: 1px solid var(--line); }
  .foot .dis { padding: 0 0.5rem; background: none; color: var(--muted); }
  /* The asks dismissed from Waiting on you: one muted row that opens to a list, each with Restore. */
  .gone-asks { margin-top: 0.5rem; } .gone-asks summary { color: var(--muted); }
  .gone-asks .rows { padding: 0; } .gone-asks li { justify-content: space-between; gap: 0.75rem; min-height: 2.75rem; }
  .gone-asks .dis { flex: none; padding: 0 0.5rem; border-color: transparent; background: none; color: var(--accent); font-weight: 600; }
  .sec-head .clear { margin-left: auto; }
  /* Waiting on you: one row of type chips, and the sort beside them (or below them on a phone). */
  .filters { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 0.75rem; margin: 0 0 0.75rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.375rem; }
  .chips button { min-height: 2.25rem; padding: 0 0.75rem; border-radius: 999px; font-size: 0.875rem; font-weight: 600; }
  .sort { display: flex; align-items: center; gap: 0.5rem; color: var(--muted); font-size: 0.875rem; font-weight: 600; }
  .sort select { min-height: 2.25rem; padding: 0 0.5rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--surface); color: var(--text); font: inherit; }
  .chip { padding: 0 0.5rem; border: 1px solid currentColor; border-radius: 999px; color: var(--accent);
    font-size: 0.6875rem; font-weight: 600; line-height: 1.25rem; letter-spacing: 0.04em; text-transform: uppercase; }
  /* Each option is a tall phone frame, side by side; on a phone the row swipes, one frame at a time, and the next one peeks in.
     Every option shares the label, frame and button rows, so a label that wraps never pushes one frame below the rest.
     The row keeps 0.25rem of room on each side for focus rings, given back by the margin. */
  .mocks { --tall: min(68svh, 42rem); display: grid; grid-template-rows: auto auto auto; grid-auto-flow: column; justify-content: start;
    grid-auto-columns: min(85%, calc(var(--tall) * 9 / 19.5)); gap: 0.5rem 0.875rem; margin: -0.25rem; padding: 0.25rem 0.25rem 0.5rem;
    overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scroll-padding: 0 0.25rem; }
  .mock { display: grid; grid-row: span 3; grid-template-rows: subgrid; margin: 0; min-width: 0; scroll-snap-align: start; }
  .mock > button { grid-row: 3; }

  /* A frame draws the mock at about phone width (1.7 times the frame) at that fraction, cropped from the top. */

    border: 0.375rem solid var(--bezel); border-radius: 1.75rem; box-shadow: 0 0 0 1px var(--border); }
  .shot iframe { position: absolute; inset: 0 auto auto 0; width: 170%; height: 170%; border: 0; transform: scale(calc(1 / 1.7)); transform-origin: 0 0; pointer-events: none; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .mock figcaption { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; min-height: 1.75rem; font-size: 0.875rem; align-self: end; }
  .mock figcaption .label { flex: 1 1 6rem; font-weight: 500; }
  .shot.aiming { border-color: var(--accent); }
  .shot.none { display: grid; place-items: center; margin: 0; padding: 1rem; text-align: center; color: var(--muted); background: var(--surface); border: 2px dashed var(--border); }
  .ann { display: grid; gap: 0.5rem; }
  .ann .actions { margin: 0; }
  .ann label { display: block; }
  .ann li p { margin: 0; }
  .ann ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; }
  .ann li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 0.5rem; }
  /* Ladder rungs: a diagram at card width, an interactive page in a sandboxed frame; a white page so drawings read in dark mode. */
  .rung { grid-column: 1 / -1; display: grid; gap: 0.25rem; justify-items: start; }
  .rung .frame { display: block; width: 100%; border: 1px solid var(--line); border-radius: 0.625rem; overflow: hidden; background: #fff; }
  .rung img { display: block; width: 100%; height: auto; max-height: 80vh; object-fit: contain; }
  /* Short on a phone so a small page leaves no tall blank; Open full size shows the rest. */
  .rung iframe { display: block; width: 100%; height: min(18rem, 50vh); border: 0; }
  .rung .gone { color: var(--danger); margin: 0; }
  .rung > .meta { color: var(--accent); margin: 0; }
  .badge { padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: var(--accent); border: 1.5px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .round { margin-top: 0.5rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
  .ask { margin: 1rem 0 0; padding: 0.25rem 1rem 0.75rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.75rem; }
  textarea { display: block; width: 100%; max-width: 70ch; margin-top: 0.25rem; padding: 0.5rem 0.75rem; border: 1px solid var(--border);

  .saved-note { white-space: pre-line; }
  button:focus-visible, summary:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .shot:focus-visible { outline-offset: -2px; }

  @media (min-width: 45rem) {
    main { padding: 0 2rem; }
    .row { grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 0.875rem 2rem; padding: 1.125rem 1.25rem; }
    .row.design, .row.update { grid-template-columns: minmax(0, 1fr); gap: 0.875rem; }
    /* The frames share the card width down to 11rem each; only a list longer than that scrolls. */
    .mocks { grid-auto-columns: minmax(11rem, calc(var(--tall) * 9 / 19.5)); }
    .rung iframe { height: min(32rem, 75vh); }
    /* A picture card stacks like a design card: the picture, then its buttons at their own width. */
    .row:has(> .rung) { grid-template-columns: minmax(0, 1fr); gap: 0.875rem; }
    .row:has(> .rung) .choices { justify-content: start; }
    .choices { grid-template-columns: repeat(2, minmax(5.5rem, auto)); }
    .row:has(.choices.many) { row-gap: 0.875rem; }
    .choices.many { grid-column: 1 / -1; }
    .choices.many button { flex: 0 1 auto; min-width: 5.5rem; }
    .row:has(.choices.told) { grid-template-columns: minmax(0, 1fr); }
    .choices.told { grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }

  @media (min-width: 60rem) {
    body { display: grid; grid-template-columns: 19rem minmax(0, 1fr); }
    .side { display: flex; flex-direction: column; gap: 0.25rem; position: sticky; top: 0; height: 100vh; padding: 1.5rem 1rem;

    .side a { display: flex; align-items: center; gap: 0.75rem; min-height: 2.75rem; padding: 0 0.625rem; border-radius: 0.625rem; color: var(--text); text-decoration: none; }
    .side a[aria-current] { background: var(--surface); font-weight: 600; }
    .side .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .brand { margin: 0 0 1rem 0.625rem; font-weight: 700; }
    main { width: 100%; padding: 0 3rem; }
    .back { display: none; }
    .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .pair { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
    .areas { grid-template-columns: 1fr 1fr; align-items: start; }
    .tri { display: grid; grid-template-columns: minmax(16rem, 2fr) minmax(0, 3fr); gap: 2rem; align-items: start; }
    .queue { display: grid; gap: 0.25rem; margin: 0; padding: 0; list-style: none; }
    .queue button { display: grid; width: 100%; padding: 0.75rem 1rem; border-color: transparent; background: none; text-align: left; }
    .queue button[aria-current] { border-color: var(--line); background: var(--surface); box-shadow: var(--shadow); }
    .queue .meta { margin: 0.125rem 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hint, .upnext { display: none; }
    .reports { grid-template-columns: 1fr 1fr; align-items: start; }
    /* Answered sets each row as its own card, two across; an opened row takes the whole width. */
    .rows.i-answered { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; align-items: start; padding: 0; border: 0; background: none; box-shadow: none; }
    .rows.i-answered > li { padding: 0 0.5rem 0 1rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: var(--shadow); }
    .rows.i-answered > li:has(.done[open]) { grid-column: 1 / -1; }

    .list.in-evidence { grid-template-columns: 1fr 1fr; align-items: start; } .in-evidence > .row:not(.update) { grid-column: 1 / -1; }
    .keys { display: block; }
  }

<body>
<nav class="side" id="nav" aria-label="Board areas"></nav>
<main><p class="banner" id="banner" role="alert" hidden></p><div id="board"></div></main>
<div id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden></div>
<div id="toast" role="status" hidden><span id="toast-text"></span><button id="undo" hidden>Undo</button></div>
<script>
  let state = { decisions: [], answers: {} };
  // An exported copy carries its state and files inline and is read-only.
  const FROZEN = window.FROZEN, src = (url) => FROZEN?.files[url] ?? url;
  // Typed notes not yet sent, kept across re-renders and reloads in this browser, per board file.
  const drafts = new Map(), stored = () => `sign-off-drafts ${state.file}`;
  const keep = () => { try { localStorage.setItem(stored(), JSON.stringify([...drafts])); } catch {} };
  let loaded = false;
  // Text goes in as text nodes, never as HTML, so a title from the file can't run code.
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    e.append(...kids);
    return e;
  };

  /** sent runs only once the server saved the request, so a draft is dropped only then. */
  async function call(path, init, sent) {
    const res = await fetch(path, init);
    const body = await res.json().catch(() => ({ error: `The server replied ${res.status}` }));
    if (!res.ok) throw Object.assign(new Error(body.error), { status: res.status });
    state = body;
    if (!loaded) {
      loaded = true;
      try { for (const [k, v] of JSON.parse(localStorage.getItem(stored())) ?? []) drafts.set(k, v); } catch {}
    }
    sent?.();
    render();
  }

  const clearIfSaved = (key, sent) => () => { if (drafts.get(key) === sent) drafts.delete(key); keep(); };

  function save(d, o, buttons, err) {
    buttons.forEach((b) => (b.disabled = true));
    // An answers-only board takes no comments, and words sent as the answer are the answer itself (a reply item's also go as a comment).
    const typed = state.answers_only || (o.value === 'text' && !d.reply) ? '' : (drafts.get(d.key) ?? '').trim();
    const note = drafts.get(d.key) ?? noteOf(d), before = answerOf(d.key);
    const drop = clearIfSaved(d.key, drafts.get(d.key));
    call('/api/answers', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: d.key, answer: o.value, note }),
    }, () => { forget(d.key); if (!typed) drop(); }).then(() => offerUndo(d, before)).then(() => typed && call('/api/messages', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: 'comment', key: d.key, text: typed }),
    }, drop)).catch((e) => {
      shown(err).textContent = `Couldn't save: ${e.message}`;
      buttons.forEach((b) => (b.disabled = false));
    });
  }

  const toast = document.getElementById('toast'), toastText = document.getElementById('toast-text'), undoBtn = document.getElementById('undo');
  let hide;
  const answerOf = (key) => (Object.hasOwn(state.answers, key) ? state.answers[key] : undefined);
  // The saved note, for the next pick or round. Words sent as the answer are that answer, not a note to carry over;
  // a reply item's reply still goes with the answer picked after it.
  const noteOf = (d) => (answerOf(d.key)?.answer === 'text' && !d.reply ? '' : answerOf(d.key)?.note ?? '');
  // The toast stays while the pointer is on it or the keyboard is on Undo.
  const later = (ms) => { clearTimeout(hide); hide = setTimeout(() => (toast.matches(':hover') || undoBtn.matches(':focus-visible') ? later(1500) : (toast.hidden = true)), ms); };
  const say = (text, ms, undo) => {
    toastText.textContent = text;
    undoBtn.hidden = !undo;
    undoBtn.disabled = false;
    undoBtn.onclick = undo;
    toast.hidden = false;
    later(ms);
  };
  /** After a tap, a few seconds to take it back. Undo saves the answer from before the tap (or none) the usual way, so it is recorded too. */
  function offerUndo(d, before) {
    const now = answerOf(d.key);
    if (!now) return;
    undoBtn.setAttribute('aria-label', `Undo, ${headline(d)}`);
    say(`Saved: ${now.answer === 'text' ? 'your reply' : now.label}`, 5000, () => {
      undoBtn.disabled = true;
      cur = d.key; // Triage shows the ask again.
      call('/api/answers', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ key: d.key, answer: before?.answer ?? '', note: before?.note ?? '' }) })
        .then(() => say(before ? `Back to: ${before.answer === 'text' ? 'your reply' : before.label}` : 'Undone: not answered', 3000),
          (e) => say(`Couldn't undo: ${e.message}`, 8000));
    });
    // The tap redrew its card and took the focus with it: put it on Undo so the keyboard can reach it in time.
    if (document.activeElement === document.body || !document.activeElement) undoBtn.focus();
  }

  // A render while a request was out replaced the error line; write to the one on screen.
  const shown = (err) => document.getElementById(err.id) ?? err;

  /** Sends a comment or a queued prompt for the agent; the typed text stays until the server has it. */
  function send(btn, err, body, draft, text) {
    btn.disabled = true;
    call('/api/messages', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...body, text }) },
      clearIfSaved(draft, drafts.get(draft))).catch((e) => {
      shown(err).textContent = `Couldn't send: ${e.message}`;
      btn.disabled = false;
    });
  }

  /** A linked run's result in plain words, for the line over the headline. */
  const RESULT = { 'RUN PASS': ['ok', 'Check passed'], 'RUN FAIL': ['bad', 'Check failed'], INCONCLUSIVE: ['warn', 'Check did not finish'], UNVERIFIED: ['warn', 'Could not check'] };
  /** What an engineer may want of a linked run or a commit, folded under Details so the card leads with the result. */
  function tech(d) {
    const run = d.evidence, commit = run?.commit ?? (/^[a-f0-9]{7,40}$/.test(d.link ?? '') ? d.link : '');
    if (!commit) return '';
    return el('details', { class: 'tech' }, el('summary', {}, 'Details'), headline(d) === d.title ? '' : el('p', { dir: 'auto' }, d.title), el('p', {}, `Commit ${commit}`),
      ...(run ? [el('p', {}, 'The agent wrote the lines below; the board did not check them.'), ...['outcome', 'repro', 'proof', 'evidence'].map((name) =>
        el('p', { dir: 'auto' }, el('strong', {}, `${name}: `), run[name].replace(new RegExp(`^${name}:\\s*(?=\\S)`, 'i'), '')))] : []));
  }

  const NAMES = { decision: 'Decision', design: 'Design', evidence: 'Evidence', diagram: 'Diagram', interactive: 'Interactive', explainer: 'Explainer', signin: 'Sign-in' };
  // The type a question shows as, read from what it already carries: a design pick is a design, a gate has its run, a yes/no has exactly
  // yes and no, any other choice is a pick-one, one answered in words is a reply, and a question with nothing to answer is info.
  // A gate keeps the Approval name even with yes/no options: the brief names it as its own type.
  const TYPE_NAMES = { ...NAMES, design: 'Design pick', 'yes-no': 'Yes/No', 'pick-one': 'Pick one', reply: 'Reply', approval: 'Approval', info: 'Info' };
  const typeOf = (d) => (d.type === 'design' ? 'design' : d.type === 'signin' ? 'signin' : d.type === 'evidence' ? 'evidence' : d.run ? 'approval'
    : !d.options.length ? d.reply ? 'reply' : 'info' : d.options.map((o) => o.value).sort().join() === 'no,yes' ? 'yes-no' : 'pick-one');
  // Any other type gets the plain card until it has its own renderer. What waits shows its answer's name; what only reads keeps its own.
  const kind = (d) => (area(d) === 'waiting' ? TYPE_NAMES[typeOf(d)] : d.type === 'decision' ? '' : NAMES[d.type] ?? d.type.replace(/-/g, ' '));
  // A done-done run's outcome line is the plain result a person can now see; the title it sends only names the run.
  const headline = (d) => (d.type === 'evidence' && d.evidence?.outcome.length <= 160 ? d.evidence.outcome : d.title);
  const title = (d) => (d.type === 'evidence' ? `Update ${d.number} · ${headline(d)}` : d.title);

  /** Dismiss hides items from this board (the agent is not told, so an ask keeps waiting); Undo puts them back. */
  // The server takes at most 200 keys a request; the requests run one after another so the last reply carries every change.
  const setDismissed = (keys, dismissed) => Array.from({ length: Math.ceil(keys.length / 200) }, (_, i) => keys.slice(i * 200, i * 200 + 200))
    .reduce((sent, part) => sent.then(() => call('/api/dismiss', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ keys: part, dismissed }) })), Promise.resolve());
  function dismiss(keys, text) {
    setDismissed(keys, true).then(() => {
      undoBtn.setAttribute('aria-label', `Undo, ${text}`);
      say(text, 5000, () => {
        undoBtn.disabled = true;
        setDismissed(keys, false).then(() => say('Back on the board', 3000), (e) => say(`Couldn't undo: ${e.message}`, 8000));
      });
      undoBtn.focus();
    }, (e) => say(`Couldn't dismiss: ${e.message}`, 8000));
  }
  const canDismiss = () => !state.readonly && !FROZEN;
  function xBtn(d, label) {
    if (!canDismiss()) return '';
    const b = el('button', { class: label ? 'dis' : 'x', 'aria-label': `Dismiss, ${title(d)}` }, label ?? '×');
    b.onclick = () => dismiss([d.key], area(d) === 'waiting' ? 'Dismissed · the agent still waits' : `Dismissed: ${title(d)}`);
    return b;
  }
  function clearAll(done) {
    if (!canDismiss() || !done.length) return '';
    const b = el('button', { class: 'clear' }, 'Clear all done');
    b.onclick = () => dismiss(done.map((d) => d.key), `${done.length} cleared`);
    return b;
  }

  function row(d, { x = true } = {}) {
    const err = el('div', { class: 'err', role: 'alert', id: `err-${d.key}` });
    const saved = Object.hasOwn(state.answers, d.key) ? state.answers[d.key] : undefined;
    // A read-only board, or an item with nothing to answer, shows no answer, note or comment controls.
    const design = d.type === 'design', ro = state.readonly || !(d.options.length || d.reply), name = headline(d);
    const buttons = d.options.map((o) => {
      const rec = o.value === d.recommend_value && !design;
      return el('button', { class: rec ? 'rec' : '', 'aria-label': `${o.label}${o.outcome ? `: ${o.outcome}` : ''}, ${name}`, 'aria-pressed': o.value === saved?.answer, ...(rec && { 'aria-describedby': `rec-${d.key}` }) },
        design ? (o.value === saved?.answer ? 'Picked' : 'Pick') : o.label, rec ? el('span', { class: 'tag', id: `rec-${d.key}` }, 'Recommended') : '',
        // What happens next if this is picked, and why the recommended one is.

    const folded = (d) => merged.has(d.key) && !isAnswered(d);
    for (const d of [...state.decisions].reverse()) if (!gone.has(d.key) && !folded(d)) by[area(d)].push(d);
    // Waiting on you reads newest first unless the viewer chose oldest first. A sign-in blocks someone now, so sign-ins come first either way.
    let latest = -Infinity;
    const inFileOrder = by.waiting.slice().reverse().map((d, i) => { const t = Date.parse(d.filed); if (!Number.isNaN(t)) latest = t; return { d, t: latest, i }; });
    const byTime = inFileOrder.sort((x, y) => (x.t === y.t ? x.i - y.i : x.t - y.t)).map((x) => x.d);
    const asked = waitSort === 'oldest' ? byTime : byTime.reverse();
    by.waiting = [...asked.filter((d) => d.type === 'signin'), ...asked.filter((d) => d.type !== 'signin')];
    // A type chip whose asks are all answered or dismissed falls back to All.
    if (waitType !== 'all' && !by.waiting.some((d) => typeOf(d) === waitType)) waitType = 'all';
    const shown = waitType === 'all' ? by.waiting : by.waiting.filter((d) => typeOf(d) === waitType);
    const hidden = state.decisions.filter((d) => gone.has(d.key) && area(d) === 'waiting' && !folded(d));
    by.answered.sort((x, y) => state.answers[y.key].at.localeCompare(state.answers[x.key].at));
    const [, at, key] = /^#(waiting|evidence|reports|answered)(?:\/([\w.-]+))?$/.exec(location.hash) ?? [];
    const link = (a, name, n) => el('a', { href: `#${a}`, ...(a === (at ?? '') && { 'aria-current': 'page' }) }, icon(a || 'summary'), name, n === undefined ? '' : el('span', { class: 'n' }, String(n)));
    document.getElementById('nav').replaceChildren(el('p', { class: 'brand' }, 'sign-off'), link('', 'Summary'), ...Object.keys(AREAS).map((a) => link(a, AREAS[a], by[a].length)));
    const ro = state.readonly ? 'Read only' : FROZEN ? `Read-only copy, ${FROZEN.exported}` : '';
    const top = el('header', { class: 'top' }, at ? el('a', { class: 'back', href: '#' }, '‹ Summary')
      : el('p', { class: 'date' }, new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })),
    el('h1', { tabindex: '-1' }, at ? AREAS[at] : 'Summary'), at ? '' : icon('you'), ro ? el('p', { class: 'meta' }, ro) : '',
    at === 'reports' && !state.readonly && by.reports.length ? el('p', { class: 'lede' }, by.reports.some((d) => d.steps)
      ? 'How the tools work, step by step. Tap one to open it.' : 'Explainers the agents made for you. Tap one to open it.')
      : at === 'answered' && by.answered.length ? el('p', { class: 'lede' }, `${by.answered.filter((d) => isToday(state.answers[d.key].at)).length} answered today.`)
      : at === 'evidence' && by.evidence.length ? el('p', { class: 'lede' }, updates(by.evidence)) : '');
    const first = by.waiting[0], more = by.waiting.length > 1 ? `Answer all ${by.waiting.length} in Triage →` : 'Open in Triage →';
    const needs = el('section', { class: 'card needs' }, el('h2', {}, 'Needs you first'), ...(first ? [first.filed ? el('p', { class: 'meta since' }, `Waiting since ${when(first.filed)}`) : '', row(first, { x: false }),
      el('div', { class: 'foot' }, xBtn(first, 'Dismiss'), el('a', { class: 'more', href: '#waiting' }, more))] : [el('p', { class: 'meta' }, 'Nothing is waiting on you.')]), dismissed(hidden));
    document.getElementById('board').replaceChildren(top, ...(at === 'waiting' && !state.readonly ? [filters(by.waiting), triage(shown, hidden)]
      : at === 'reports' && !state.readonly ? [by.reports.some((d) => d.steps) ? el('p', { class: 'card legend' }, ...Object.keys(MARKS).map((m) => el('span', {}, el('span', { class: `mk mk-${m}` }), MARKS[m]))) : '',
        ...(by.reports.length ? reportGroups(by.reports) : [el('p', { class: 'empty' }, EMPTY.reports)]), notes(by.notes)] : at === 'answered' && by.answered.length ? done(by.answered) : at ? [at === 'evidence' && by[at].length ? el('div', { class: 'sec-head' }, el('h2', {}, 'Updates')) : '', at === 'waiting' ? filters(by.waiting) : '', by[at].length ? el('div', { class: `list in-${at}${state.readonly ? ' readonly' : ''}` }, ...(at === 'waiting' ? shown : by[at]).map(row))
      : el('p', { class: 'empty' }, at === 'answered' && state.decisions.some((d) => gone.has(d.key) && isAnswered(d)) ? 'All done items cleared.' : EMPTY[at])] : [el('div', { class: 'tiles' }, ...Object.keys(AREAS).map((a) => tile(a, by[a]))),
      el('div', { class: 'pair' }, needs, today(by.answered)), ...(FROZEN || state.readonly || state.answers_only ? [] : [ask()]),
      el('div', { class: 'areas' }, ...Object.keys(AREAS).map((a) => section(a, by[a])))]));
    readPage(at === 'reports' && key ? state.decisions.find((d) => d.key === key && reads(d) && !gone.has(d.key)) : undefined);
    if (FROZEN) freeze();
  }
  function freeze() {
    // Answers stay as they are, but nothing in the copy can be sent.
    document.querySelectorAll('#board .choices button, #board .mock button, #board .note button, #board .note textarea').forEach((e) => (e.disabled = true));
    // A browser will not open a data: link in a new tab; the inline preview is the copy.
    document.querySelectorAll('#board a[href^="data:"]').forEach((a) => a.removeAttribute('href'));
  }
  // A new screen starts at its top, or at the item tapped on the Summary, with the focus on its title.
  // Closing a report goes back to its card, with the focus on its link; an open report takes the focus on its title.
  addEventListener('hashchange', () => {
    const back = !reader.hidden && reader.dataset.key;
    if (jump && location.hash === '#waiting') [cur, jump] = [jump, null];
    if (location.hash === '#waiting') waitType = 'all';
    render();
    if (!reader.hidden) return reader.querySelector('h1').focus();
    const item = (jump || back) && document.getElementById(`item-${jump || back}`);
    jump = null;
    item ? item.scrollIntoView() : scrollTo(0, 0);
    ((back && item?.querySelector('h3 a')) || document.querySelector('#board h1')).focus({ preventScroll: true });
  });
  // An interactive page may post its own height, `{ height: <px> }`, and its frame then fits it with no blank below.
  // Only a frame's own message sizes that frame, and never past 10000px.
  addEventListener('message', (e) => {
    const frame = [...document.querySelectorAll('.rung iframe')].find((f) => f.contentWindow === e.source), h = e.data?.height;
    if (frame && Number.isFinite(h) && h > 0) frame.style.height = `${Math.ceil(Math.min(h, 10_000))}px`;
  });
  // A design mock page may point (web/point.js): the board keeps the last element named per mock, and turns pointing on for one mock frame.
  const pointing = new Map(), pointed = new Map();
  const mockFrame = (source) => [...document.querySelectorAll('.mock iframe')].find((f) => f.contentWindow === source);
  const aim = (frame) => {
    const on = talks() && pointing.get(frame.dataset.mock) === true;
    frame.style.pointerEvents = on ? 'auto' : '';
    frame.parentElement.classList.toggle('aiming', on);
    frame.contentWindow.postMessage({ 'sign-off': 'point', on }, '*');
  };
  function point(frame, on) {
    pointing.set(frame.dataset.mock, on);
    aim(frame);
  }
  // While pointing is on, a tap never opens the mock full size, even one that reaches the board instead of the frame:
  // one on the frame's edge, one the browser sends there until it has drawn the frame taking taps, or one before a frame drawn anew is ready.
  addEventListener('click', (e) => {
    const frame = e.target.closest?.('.shot')?.querySelector('iframe[data-mock]');
    if (frame && talks() && pointing.get(frame.dataset.mock) === true) e.preventDefault();
  });
  addEventListener('message', (e) => {
    const frame = mockFrame(e.source), msg = e.data;
    if (!frame || !msg) return;
    if (msg['sign-off'] === 'ready') aim(frame);
    if (msg['sign-off'] !== 'pointed' || !['ref', 'tag', 'text'].every((k) => typeof msg[k] === 'string')) return;
    pointed.set(frame.dataset.mock, { ref: msg.ref, tag: msg.tag, text: msg.text });
    // The element named opens the comment editor on its card, with its saved comment when it has one.
    const dm = frame.dataset.mock, cut = dm.indexOf('~'), d = state.decisions.find((x) => x.key === dm.slice(0, cut));
    if (!d || !talks() || pointing.get(dm) !== true) return;
    const mock = dm.slice(cut + 1);
    editing.set(d.key, { mock, hash: d.mocks?.find((m) => m.value === mock)?.hash, ref: msg.ref, tag: msg.tag, words: msg.text });
    redraw(d);
    document.getElementById(`ann-text-${d.key}`)?.focus();
  });

  const banner = document.getElementById('banner');
  const failed = (e) => {
    banner.textContent = `Can't read the board file: ${e.message}`;
    banner.hidden = false;
  };
  // Another program can change the board file (a feed, a new sign-in, signin done), so the page checks it every 20 seconds and redraws only on a change.
  async function refresh() {
    try {
      const res = await fetch('/api/decisions'), body = await res.json().catch(() => ({ error: `The server replied ${res.status}` }));
      if (!res.ok) throw new Error(body.error);
      banner.hidden = true;
      if (JSON.stringify(body) === JSON.stringify(state)) return;
      // A redraw keeps the reply box being typed in focused, with its caret where it was.
      const typing = document.activeElement?.tagName === 'TEXTAREA' && document.activeElement, at = typing && typing.selectionStart;
      state = body;
      render();
      const box = typing && document.getElementById(typing.id);
      if (box) box.focus(), box.setSelectionRange(at, at);
    } catch (e) { failed(e); }
  }
  if (FROZEN) (state = FROZEN), render();
  else call('/api/decisions').then(() => {
    banner.hidden = true;
    setInterval(refresh, 20_000);
  }, failed);
</script>
