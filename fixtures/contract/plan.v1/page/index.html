<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan: show plans on the board</title>
<style>
:root { color-scheme: light dark; }
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #111; background: transparent; }
@media (prefers-color-scheme: dark) { body { color: #eee; } }
svg { display: block; width: 100%; height: auto; }
svg text { font: 13px system-ui, sans-serif; fill: currentColor; }
</style>
</head>
<body>
<svg viewBox="0 0 340 110" role="img" aria-label="The agent posts a plan, the board shows it, Umer answers, and one send-back returns to the agent">
  <rect x="2" y="25" width="70" height="40" rx="6" fill="none" stroke="currentColor"/><text x="37" y="50" text-anchor="middle">Agent</text>
  <rect x="134" y="25" width="70" height="40" rx="6" fill="none" stroke="currentColor"/><text x="169" y="50" text-anchor="middle">Board</text>
  <rect x="266" y="25" width="70" height="40" rx="6" fill="none" stroke="currentColor"/><text x="301" y="50" text-anchor="middle">Umer</text>
  <path d="M74 40 H130 M206 40 H262" stroke="currentColor" stroke-width="2"/>
  <path d="M301 67 V100 H37 V67" fill="none" stroke="currentColor" stroke-dasharray="4 3"/><text x="169" y="90" text-anchor="middle">one send-back</text>
</svg>
</body>
</html>
