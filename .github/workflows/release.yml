name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version already on npm"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version not on npm"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm 11.5+ for trusted publishing
        run: |
          if ! node -e 'const [a,b]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&b>=5)?0:1)' "$(npm --version)"; then
            npm install -g npm@latest
          fi
          npm --version
      - run: npm install -g done-done-axi@0.6.22 chrome-devtools-axi@0.1.34
      - run: done-done run install
      - run: done-done run test
        env:
          CHROME_DEVTOOLS_AXI_CHROME_ARGS: --no-sandbox
      - run: done-done run skill
      - name: Publish if this version is not on npm
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version already on npm"
            exit 0
          fi
          npm publish --provenance --access public
