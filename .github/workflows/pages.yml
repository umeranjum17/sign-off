# Static demo site for the README's Try-it-live link. Builds web/ plus the
# demo shim into demo-dist/ and publishes it to the repo's github.io URL.
# No secrets, no tokens, no analytics; the demo keeps answers in the
# visitor's own browser.
name: pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
