name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One run per pull request, or per branch for pushes, so a superseded PR run is cancelled while
# a push to main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A PR that changes only root *.md files other than README.md skips the heavy steps; `test`
      # still reports green, so the branch rule that requires it never waits. Tests scan README.md
      # and docs/, so those run the full suite. A push to main always runs it.
      - id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --no-renames "origin/$BASE...HEAD")
          docs_only=true
          [ -n "$files" ] || docs_only=false
          while IFS= read -r f; do
            case "$f" in
              README.md | */*) docs_only=false ;;
              *.md) ;;
              *) docs_only=false ;;
            esac
          done <<< "$files"
          echo "Changed files:"; echo "$files"; echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        run: npm install -g done-done-axi@0.6.22
      - if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        run: done-done run install
      # The test journey runs the slop lint, whose screen pass reads the board in a real browser.
      - if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        run: npm install -g chrome-devtools-axi@0.1.34
      - if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        env:
          CHROME_DEVTOOLS_AXI_CHROME_ARGS: --no-sandbox
        run: |
          if done-done run test; then exit 0; fi
          for log in "$HOME/.done-done/evidence/sign-off"/*/test.log; do
            if [ -f "$log" ]; then cat "$log"; fi
          done
          exit 1
      - if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        run: done-done run skill
      # Every card kind x action x tab x width x theme, with done-done's look step. The look step needs done-done-axi 0.6.9, whose
      # look no longer calls a one-line ellipsized title clipped (the plan-review records test still runs on 0.3.0, whose check needs no judge), so it has its own install.
      - if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        run: npm install -g --prefix "$RUNNER_TEMP/dd" done-done-axi@0.6.22
      - if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        env:
          CHROME_DEVTOOLS_AXI_CHROME_ARGS: --no-sandbox
        run: PATH="$RUNNER_TEMP/dd/bin:$PATH" done-done run board-actions
      # The Evidence feed by name: a proof filed after the board was read whole lands on Evidence by the next poll, and the feed-stall alarm
      # trips on a stale pair of timestamps and stays quiet on the board it drove.
      - if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        env:
          CHROME_DEVTOOLS_AXI_CHROME_ARGS: --no-sandbox
        run: PATH="$RUNNER_TEMP/dd/bin:$PATH" done-done run evidence-feed
      - name: Install comment capture encoder
        if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
      - name: Report section comment and note send regression
        if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        env:
          CHROME_DEVTOOLS_AXI_CHROME_ARGS: --no-sandbox
        run: SEND_FEEDBACK_ONLY=1 node .agents/skills/done-done-verify-sign-off/part-comment-shots.mjs "$RUNNER_TEMP/comment-send" light 390
