<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign-in tour</title>
<style>* { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
.box { width: min(100% - 32px, 420px); padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px #e2e8f0; } h1 { margin: 0 0 8px; font-size: 22px; }
button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 10px; background: #0f172a; color: #fff; font: inherit; font-weight: 600; }</style>
<div class="box"><p id="step">Step 1 of 2</p><h1 id="head">Enter your email</h1><p id="body">We send a code to Umer's inbox.</p><button id="next">Next</button></div>
<script>document.getElementById('next').onclick = () => { document.getElementById('step').textContent = 'Step 2 of 2'; document.getElementById('head').textContent = 'Enter the code'; document.getElementById('body').textContent = 'Six digits, from the email.'; };</script>
