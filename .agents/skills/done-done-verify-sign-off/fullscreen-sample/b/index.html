<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"><title>Fleet: cards</title>
<header><b>Fleet</b><span>Umer</span></header>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="now">Now</button><button role="tab" aria-selected="false" data-tab="done">Done</button></div>
<section class="grid" data-panel="now"><div class="card"><h2>sign-off</h2><p>Working · 09:12</p></div><div class="card"><h2>muxr</h2><p>Needs a decision · 08:40</p></div></section>
<section class="grid" data-panel="done" hidden><div class="card"><h2>first-draft</h2><p>Done · 07:55</p></div></section>
<script>
for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => {
  for (const x of document.querySelectorAll('[data-tab]')) x.setAttribute('aria-selected', String(x === b));
  for (const p of document.querySelectorAll('[data-panel]')) p.hidden = p.dataset.panel !== b.dataset.tab;
};
</script>
